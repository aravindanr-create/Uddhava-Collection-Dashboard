<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#fbbf24" />
<title>Uddhava Logistics — Vehicle Allotment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- SheetJS for Excel parsing -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#fffbeb;
    --surface:#ffffff;
    --ink:#0f172a;
    --ink-2:#334155;
    --muted:#64748b;
    --line:#fde68a;
    --line-2:#fcd34d;
    --brand:#f59e0b;
    --brand-deep:#b45309;
    --brand-bright:#fbbf24;
    --brand-pale:#fef3c7;
    --ok:#16a34a;
    --warn:#f59e0b;
    --bad:#dc2626;
  }
  html,body{background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',sans-serif;-webkit-font-smoothing:antialiased;}
  .font-mono{font-family:'JetBrains Mono',monospace;}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-track{background:#fef3c7}
  ::-webkit-scrollbar-thumb{background:#fbbf24;border-radius:8px}
  ::-webkit-scrollbar-thumb:hover{background:#f59e0b}
  .pulse-dot{animation:pulse 1.8s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.4)}}
  .slide-up{animation:slideUp .35s cubic-bezier(.16,1,.3,1) backwards}
  @keyframes slideUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  .fade-in{animation:fadeIn .25s ease-out}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  input,select,textarea{font-family:'Plus Jakarta Sans',sans-serif;}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:1px;border-color:transparent}
  .btn-primary{background:var(--ink);color:#fbbf24;font-weight:700;transition:all .15s}
  .btn-primary:hover{background:#000;box-shadow:0 4px 14px rgba(0,0,0,.25)}
  .btn-primary:disabled{background:#d6d3d1;color:#fff;cursor:not-allowed;box-shadow:none}
  .btn-amber{background:#f59e0b;color:#1c1917;font-weight:700;transition:all .15s}
  .btn-amber:hover{background:#d97706}
  .hero-dark{
    background:
      radial-gradient(circle at 100% 0%, rgba(251,191,36,0.18) 0, transparent 45%),
      radial-gradient(circle at 0% 100%, rgba(245,158,11,0.10) 0, transparent 40%),
      linear-gradient(135deg,#0f172a 0%,#1e293b 60%,#0f172a 100%);
  }
  .hero-grid{
    background-image:
      linear-gradient(rgba(255,255,255,0.04) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,0.04) 1px,transparent 1px);
    background-size:32px 32px;
  }
  .drop-zone{border:2.5px dashed #fcd34d;transition:all .2s}
  .drop-zone.drag-over{border-color:#f59e0b;background:#fffbeb}
  .drop-zone:hover{border-color:#f59e0b;background:#fefce8}
  @media(max-width:768px){.hide-mobile{display:none !important}}
  .toast{animation:toastIn .35s cubic-bezier(.16,1,.3,1)}
  @keyframes toastIn{from{opacity:0;transform:translateY(20px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo, createContext, useContext, useCallback } = React;
const { createClient } = supabase;

/* =========================================================================
   SUPABASE — hardcoded credentials (production)
   ========================================================================= */
const SUPABASE_URL = 'https://udsqghxnrsdclfxhgraz.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVkc3FnaHhucnNkY2xmeGhncmF6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg0ODY3OTcsImV4cCI6MjA5NDA2Mjc5N30.Ezl5qfpzRxGRtNofz3aieTIPuNKKE-Kf5cxrHN4uHdU';
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

/* =========================================================================
   CONSTANTS
   ========================================================================= */
const BRANCHES  = ['TVK','RNT','HSR','MDU','SPR','CBM','DBR'];
const INCHARGES = ['Vinoth','Mani','Kumar','Ajith','Ramu','Ravi'];
const SHIFTS    = ['Day','Night'];

/* =========================================================================
   DATA LAYER — always Supabase, local fallback on error
   ========================================================================= */
const LOCAL_KEY = 'uddhava_local_v3';

const DataContext = createContext(null);
function DataProvider({ children }) {
  const [entries,  setEntries]  = useState([]);
  const [connState,setConnState]= useState('connecting'); // connecting|connected|error
  const [connError,setConnError]= useState('');
  const [toast,    setToast]    = useState(null);
  const channelRef = useRef(null);

  const showToast = (msg, kind='ok') => {
    setToast({ msg, kind, id: Date.now() });
    setTimeout(() => setToast(null), 3500);
  };

  /* ---- initial load ---- */
  useEffect(() => {
    let cancelled = false;
    (async () => {
      try {
        const { data, error } = await sb
          .from('entries')
          .select('*')
          .order('created_at', { ascending: false });
        if (error) throw error;
        if (cancelled) return;
        setEntries((data || []).map(rowToEntry));
        setConnState('connected');
      } catch (e) {
        if (cancelled) return;
        setConnState('error');
        setConnError(e.message || 'Connection failed');
        // fall back to local
        try {
          const raw = localStorage.getItem(LOCAL_KEY);
          if (raw) setEntries(JSON.parse(raw));
        } catch(_) {}
      }
    })();

    /* ---- realtime subscription ---- */
    const ch = sb.channel('entries-rt')
      .on('postgres_changes', { event:'*', schema:'public', table:'entries' }, payload => {
        setEntries(prev => {
          let next = [...prev];
          if (payload.eventType === 'INSERT') {
            const r = rowToEntry(payload.new);
            if (!next.find(x => x.id === r.id)) next = [r, ...next];
          } else if (payload.eventType === 'UPDATE') {
            const r = rowToEntry(payload.new);
            const i = next.findIndex(x => x.id === r.id);
            if (i >= 0) next[i] = r; else next = [r, ...next];
          } else if (payload.eventType === 'DELETE') {
            next = next.filter(x => x.id !== payload.old.id);
          }
          try { localStorage.setItem(LOCAL_KEY, JSON.stringify(next)); } catch(_) {}
          return next;
        });
      })
      .subscribe();
    channelRef.current = ch;

    return () => {
      cancelled = true;
      if (channelRef.current) sb.removeChannel(channelRef.current);
    };
  }, []);

  /* ---- mutations ---- */
  const addEntry = async (entry) => {
    const row = entryToRow(entry);
    const { error } = await sb.from('entries').insert(row);
    if (error) throw error;
    showToast('Entry saved ✓');
  };

  const addEntries = async (entriesArr) => {
    const rows = entriesArr.map(entryToRow);
    const { error } = await sb.from('entries').insert(rows);
    if (error) throw error;
    showToast(`${entriesArr.length} entries uploaded ✓`);
  };

  const updateEntry = async (id, patch) => {
    const { error } = await sb.from('entries').update(entryToRow(patch)).eq('id', id);
    if (error) throw error;
    showToast('Updated ✓');
  };

  const deleteEntry = async (id) => {
    const { error } = await sb.from('entries').delete().eq('id', id);
    if (error) throw error;
    showToast('Deleted');
  };

  return (
    <DataContext.Provider value={{ entries, connState, connError, addEntry, addEntries, updateEntry, deleteEntry, toast }}>
      {children}
    </DataContext.Provider>
  );
}
const useData = () => useContext(DataContext);

/* mappers */
const entryToRow = (e) => ({
  id: e.id,
  date: e.date,
  type: e.type || 'collection',
  collection_name: e.collectionName || '',
  vehicle_no: e.vehicleNo || '',
  from_loc: e.fromLoc || '',
  to_loc: e.toLoc || '',
  branch: e.branch || '',
  shift: e.shift || '',
  incharge: e.incharge || '',
  driver_name: e.driverName || '',
  driver_mobile: e.driverMobile || '',
  out_time: e.outTime || null,
  in_time: e.inTime || null,
  status: e.status || 'transit',
  remarks: e.remarks || '',
  created_at: e.createdAt || new Date().toISOString(),
});
const rowToEntry = (r) => ({
  id: r.id,
  date: r.date,
  type: r.type,
  collectionName: r.collection_name || '',
  vehicleNo: r.vehicle_no,
  fromLoc: r.from_loc,
  toLoc: r.to_loc,
  branch: r.branch,
  shift: r.shift,
  incharge: r.incharge,
  driverName: r.driver_name,
  driverMobile: r.driver_mobile,
  outTime: r.out_time,
  inTime: r.in_time,
  status: r.status,
  remarks: r.remarks,
  createdAt: r.created_at,
});

/* =========================================================================
   HELPERS
   ========================================================================= */
const fmtTime = iso => iso ? new Date(iso).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:true}) : '—';
const fmtDate = iso => iso ? new Date(iso).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}) : '—';
const fmtDur  = (a,b) => {
  if (!a || !b) return '—';
  const m = Math.round((new Date(b)-new Date(a))/60000);
  if (m < 0) return '—';
  return m < 60 ? `${m}m` : `${Math.floor(m/60)}h ${String(m%60).padStart(2,'0')}m`;
};
const toLocalInput = iso => {
  if (!iso) return '';
  const d = new Date(iso), p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
};
const todayStr = () => new Date().toISOString().slice(0,10);
const genId    = () => `E-${Date.now().toString(36).toUpperCase()}`;

/* =========================================================================
   APP SHELL
   ========================================================================= */
function App() { return <DataProvider><Shell/></DataProvider>; }

function Shell() {
  const [page,      setPage]      = useState('dashboard');
  const [showForm,  setShowForm]  = useState(false);
  const [editEntry, setEditEntry] = useState(null);
  const [now,       setNow]       = useState(new Date());
  const { connState, toast }      = useData();

  useEffect(() => { const i=setInterval(()=>setNow(new Date()),1000); return ()=>clearInterval(i); }, []);

  const tabs = [
    { key:'dashboard', label:'Dashboard', icon:'📊' },
    { key:'entries',   label:'All Entries', icon:'📋' },
    { key:'reports',   label:'Reports', icon:'📈' },
  ];

  const connMeta = {
    connecting: { dot:'bg-amber-400', label:'CONNECTING', cls:'bg-amber-100 text-amber-800' },
    connected:  { dot:'bg-green-500', label:'LIVE',       cls:'bg-green-100 text-green-800' },
    error:      { dot:'bg-red-500',   label:'OFFLINE',    cls:'bg-red-100 text-red-700'  },
  }[connState] || { dot:'bg-slate-400', label:'…', cls:'bg-slate-100 text-slate-600' };

  return (
    <div className="min-h-screen bg-amber-50">
      {/* HEADER */}
      <header className="bg-white border-b-2 border-amber-300 sticky top-0 z-30 shadow-sm">
        <div className="px-4 md:px-6 h-16 flex items-center justify-between gap-3">
          <div className="flex items-center gap-3">
            <div className="w-10 h-10 bg-gradient-to-br from-amber-400 to-amber-600 rounded-xl flex items-center justify-center text-white shadow-md">
              <svg className="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                <path d="M3 7h11v8H3zM14 10h4l3 3v2h-7zM5 17a2 2 0 11.001 4A2 2 0 015 17m12 0a2 2 0 11.001 4A2 2 0 0117 17"/>
              </svg>
            </div>
            <div>
              <div className="font-extrabold text-lg leading-tight text-slate-900">Uddhava Logistics</div>
              <div className="font-mono text-[10px] text-slate-500 tracking-widest hide-mobile">Vehicle Allotment</div>
            </div>
          </div>

          <div className="flex items-center gap-3">
            <div className="hide-mobile text-right">
              <div className="text-xs text-slate-500">{now.toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long'})}</div>
              <div className="font-mono text-sm font-bold tabular-nums">{now.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}</div>
            </div>
            {/* live badge */}
            <div className={`flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11px] font-bold ${connMeta.cls}`}>
              <span className={`w-1.5 h-1.5 rounded-full ${connMeta.dot} ${connState==='connected'?'pulse-dot':''}`}></span>
              <span className="hide-mobile">{connMeta.label}</span>
            </div>
          </div>
        </div>

        <div className="px-2 md:px-6 flex gap-0 border-t border-amber-200">
          {tabs.map(t => (
            <button key={t.key} onClick={()=>setPage(t.key)}
              className={`px-3 md:px-5 py-2.5 text-sm font-bold border-b-2 transition-colors ${page===t.key?'border-amber-500 text-amber-800':'border-transparent text-slate-500 hover:text-slate-800'}`}>
              <span className="md:hidden mr-1">{t.icon}</span>{t.label}
            </button>
          ))}
        </div>
      </header>

      {page==='dashboard' && <Dashboard onNew={()=>setShowForm(true)} onEdit={setEditEntry} goEntries={()=>setPage('entries')}/>}
      {page==='entries'   && <EntriesPage onNew={()=>setShowForm(true)} onEdit={setEditEntry}/>}
      {page==='reports'   && <ReportsPage/>}

      {/* Mobile FAB */}
      <button onClick={()=>setShowForm(true)}
        className="md:hidden fixed bottom-6 right-6 w-14 h-14 bg-amber-500 hover:bg-amber-600 text-white rounded-full shadow-2xl shadow-amber-500/40 flex items-center justify-center z-20 active:scale-95 transition-transform">
        <svg className="w-7 h-7" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path d="M12 4v16m8-8H4"/></svg>
      </button>

      {(showForm || editEntry) && <EntryForm entry={editEntry} onClose={()=>{setShowForm(false);setEditEntry(null);}}/>}

      {/* Toast */}
      {toast && (
        <div className={`toast fixed bottom-6 left-1/2 -translate-x-1/2 z-50 px-5 py-3 rounded-2xl shadow-2xl font-semibold text-sm flex items-center gap-2 ${
          toast.kind==='bad' ? 'bg-red-600 text-white' : 'bg-slate-900 text-amber-300'
        }`}>
          {toast.kind==='bad' ? '⚠' : '✓'} {toast.msg}
        </div>
      )}
    </div>
  );
}

/* =========================================================================
   DASHBOARD
   ========================================================================= */
function Dashboard({ onNew, onEdit, goEntries }) {
  const { entries } = useData();
  const latestDate = useMemo(() => {
    const dates = [...new Set(entries.map(e=>e.date))].sort().reverse();
    return dates[0] || todayStr();
  }, [entries]);
  const day       = entries.filter(e=>e.date===latestDate);
  const transit   = day.filter(e=>e.status==='transit');
  const delivered = day.filter(e=>e.status==='delivered');
  const collections = day.filter(e=>e.type==='collection');
  const shiftStats  = SHIFTS.map(s=>({ shift:s, count:day.filter(e=>e.shift===s).length, done:day.filter(e=>e.shift===s&&e.status==='delivered').length }));
  const branchStats = BRANCHES.map(b=>({ branch:b, count:day.filter(e=>e.branch===b).length })).filter(x=>x.count>0);

  return (
    <div className="p-4 md:p-6 space-y-6 max-w-7xl mx-auto">
      {/* Hero */}
      <div className="hero-dark hero-grid rounded-2xl p-6 md:p-8 shadow-xl relative overflow-hidden">
        <div className="relative flex flex-wrap items-end justify-between gap-4">
          <div>
            <div className="inline-flex items-center gap-2 mb-3">
              <span className="w-1.5 h-1.5 bg-amber-400 rounded-full pulse-dot"></span>
              <span className="font-mono text-xs text-amber-400 tracking-widest font-bold">OPERATIONS SUMMARY</span>
            </div>
            <h2 className="text-3xl md:text-4xl font-extrabold text-black tracking-tight">{fmtDate(latestDate)}</h2>
            <p className="text-slate-300 mt-1.5">
              <span className="font-bold text-white">{day.length}</span> {day.length===1?'entry':'entries'} logged
              {transit.length>0 && <span className="ml-2 text-amber-300">· {transit.length} in transit</span>}
            </p>
          </div>
          <button onClick={onNew} className="hidden md:flex items-center gap-2 bg-amber-400 hover:bg-amber-300 text-slate-900 px-5 py-3 rounded-xl font-bold shadow-lg transition-all hover:scale-105">
            <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="3" viewBox="0 0 24 24"><path d="M12 4v16m8-8H4"/></svg>
            New Entry
          </button>
        </div>
        <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mt-7">
          <KPI label="Collections"  value={collections.length}  sub="Inbound"    tone="blue"/>
          <KPI label="Total Today"  value={day.length}          sub="All entries" tone="purple"/>
          <KPI label="Delivered"    value={delivered.length}    sub="Completed"  tone="green" highlight/>
          <KPI label="In Transit"   value={transit.length}      sub="On route"   tone="amber" highlight/>
        </div>
      </div>

      {/* In Transit */}
      <Section title="In Transit" subtitle={`${transit.length} vehicle${transit.length!==1?'s':''} currently out`}
        action={<button onClick={goEntries} className="text-sm text-amber-700 font-bold hover:underline">View all →</button>}>
        {transit.length===0
          ? <EmptyState text="All vehicles back. Nothing in transit."/>
          : <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">{transit.map(e=><TransitCard key={e.id} entry={e} onEdit={()=>onEdit(e)}/>)}</div>}
      </Section>

      <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
        <Section title="By Shift" className="lg:col-span-1">
          <div className="space-y-3">
            {shiftStats.map(s=>{
              const pct = s.count ? (s.done/s.count)*100 : 0;
              return (
                <div key={s.shift} className="bg-white border border-amber-200 rounded-xl p-4">
                  <div className="flex justify-between items-baseline mb-2">
                    <div className="font-bold flex items-center gap-2"><span>{s.shift==='Day'?'☀️':'🌙'}</span>{s.shift} Shift</div>
                    <div className="font-mono text-sm"><span className="text-green-600 font-bold">{s.done}</span><span className="text-slate-400"> / {s.count}</span></div>
                  </div>
                  <div className="h-2 bg-amber-100 rounded-full overflow-hidden">
                    <div className="h-full bg-gradient-to-r from-amber-400 to-amber-600 rounded-full" style={{width:`${pct}%`}}></div>
                  </div>
                  <div className="text-xs text-slate-500 mt-1.5">{s.count ? `${Math.round(pct)}% complete` : 'No entries yet'}</div>
                </div>
              );
            })}
          </div>
          {branchStats.length>0 && (
            <div className="bg-white border border-amber-200 rounded-xl p-4 mt-3">
              <div className="font-bold mb-3 text-slate-900">By Branch</div>
              <div className="grid grid-cols-2 gap-2">
                {branchStats.map(b=>(
                  <div key={b.branch} className="flex justify-between items-center bg-amber-50 px-3 py-2 rounded-lg">
                    <span className="font-mono font-bold text-amber-800">{b.branch}</span>
                    <span className="font-bold tabular-nums">{b.count}</span>
                  </div>
                ))}
              </div>
            </div>
          )}
        </Section>

        <Section title="Recent Activity" className="lg:col-span-2">
          <div className="bg-white border border-amber-200 rounded-xl divide-y divide-amber-100 overflow-hidden">
            {day.slice(0,8).map(e=><ActivityRow key={e.id} entry={e} onClick={()=>onEdit(e)}/>)}
            {day.length===0 && <EmptyState text="No entries logged yet today."/>}
          </div>
        </Section>
      </div>
    </div>
  );
}

const KPI = ({ label, value, sub, tone='amber', highlight }) => {
  const tones = {
    blue:   { bar:'bg-blue-400',   text:'text-blue-300',   ring:'ring-blue-400/30' },
    purple: { bar:'bg-purple-400', text:'text-purple-300', ring:'ring-purple-400/30' },
    green:  { bar:'bg-green-400',  text:'text-green-300',  ring:'ring-green-400/30' },
    amber:  { bar:'bg-amber-400',  text:'text-amber-300',  ring:'ring-amber-400/30' },
  };
  const t = tones[tone];
  return (
    <div className={`relative bg-slate-800/60 backdrop-blur rounded-xl p-4 md:p-5 border border-slate-700/50 ${highlight?`ring-1 ${t.ring}`:''} overflow-hidden`}>
      <div className={`absolute top-0 left-0 right-0 h-0.5 ${t.bar}`}></div>
      <div className="flex items-start justify-between mb-2">
        <div className={`font-mono text-[10px] tracking-widest font-bold ${t.text}`}>{label.toUpperCase()}</div>
        <div className={`w-1.5 h-1.5 rounded-full ${t.bar} ${highlight?'pulse-dot':''}`}></div>
      </div>
      <div className="font-extrabold text-4xl md:text-5xl text-white leading-none tabular-nums tracking-tight">{value}</div>
      <div className="text-xs text-slate-400 mt-2">{sub}</div>
    </div>
  );
};

const Section = ({ title, subtitle, action, children, className='' }) => (
  <div className={className}>
    <div className="flex items-end justify-between mb-3">
      <div>
        <h3 className="text-lg font-extrabold text-slate-900">{title}</h3>
        {subtitle && <p className="text-sm text-slate-500">{subtitle}</p>}
      </div>
      {action}
    </div>
    {children}
  </div>
);

const EmptyState = ({ text }) => (
  <div className="bg-white border border-dashed border-amber-300 rounded-xl p-8 text-center text-slate-500">{text}</div>
);

function TransitCard({ entry, onEdit }) {
  const [, setTick] = useState(0);
  useEffect(()=>{ const i=setInterval(()=>setTick(t=>t+1),30000); return ()=>clearInterval(i); },[]);
  const elapsed = entry.outTime ? fmtDur(entry.outTime, new Date().toISOString()) : '—';
  return (

/* =========================================================================
   ENTRIES PAGE
   ========================================================================= */
function EntriesPage({ onNew, onEdit }) {
  const { entries } = useData();
  const [filter, setFilter] = useState({ date:'all', status:'all', shift:'all', branch:'all', search:'' });
  const dates = useMemo(()=>[...new Set(entries.map(e=>e.date))].sort().reverse(),[entries]);

  const filtered = entries.filter(e => {
    if (filter.date   !== 'all' && e.date   !== filter.date)   return false;
    if (filter.status !== 'all' && e.status !== filter.status) return false;
    if (filter.shift  !== 'all' && e.shift  !== filter.shift)  return false;
    if (filter.branch !== 'all' && e.branch !== filter.branch) return false;
    if (filter.search) {
      const s = filter.search.toLowerCase();
      if (!`${e.id} ${e.vehicleNo} ${e.fromLoc} ${e.toLoc} ${e.driverName} ${e.driverMobile} ${e.incharge} ${e.branch} ${e.collectionName}`.toLowerCase().includes(s)) return false;
    }
    return true;
  });

  const exportCSV = () => {
    const h = ['ID','Date','Collection Name','Vehicle','Branch','From','To','Shift','Incharge','Driver','Mobile','Out Time','In Time','Duration','Status','Remarks'];
    const rows = filtered.map(e=>[e.id,e.date,e.collectionName||'',e.vehicleNo,e.branch,e.fromLoc,e.toLoc,e.shift,e.incharge,e.driverName,e.driverMobile,fmtTime(e.outTime),fmtTime(e.inTime),fmtDur(e.outTime,e.inTime),e.status,e.remarks||'']);
    const csv = [h,...rows].map(r=>r.map(c=>`"${String(c||'').replace(/"/g,'""')}"`).join(',')).join('\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
    a.download = `uddhava-${todayStr()}.csv`; a.click();
  };

  return (
    <div className="p-4 md:p-6 space-y-4 max-w-7xl mx-auto">
      <div className="flex flex-wrap items-end justify-between gap-3">
        <div>
          <h2 className="text-2xl font-extrabold">All Entries</h2>
          <p className="text-slate-500 text-sm">{filtered.length} of {entries.length} shown</p>
        </div>
        <div className="flex gap-2">
          <button onClick={exportCSV} className="px-3.5 py-2 border-2 border-amber-300 bg-white rounded-lg text-sm font-bold hover:border-amber-500 flex items-center gap-1.5">
            <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2M7 10l5 5 5-5M12 15V3"/></svg>
            CSV
          </button>
          <button onClick={onNew} className="btn-primary px-4 py-2 rounded-lg text-sm flex items-center gap-1.5">
            <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path d="M12 4v16m8-8H4"/></svg>
            New Entry
          </button>
        </div>
      </div>

      {/* Filters */}
      <div className="bg-white border-2 border-amber-200 rounded-xl p-3 flex flex-wrap gap-2">
        <input value={filter.search} onChange={e=>setFilter({...filter,search:e.target.value})}
          placeholder="🔍  Search vehicle, driver, branch..."
          className="flex-1 min-w-[180px] px-3 py-2 bg-amber-50/50 border border-amber-200 rounded-lg text-sm"/>
        <select value={filter.date} onChange={e=>setFilter({...filter,date:e.target.value})} className="px-3 py-2 bg-amber-50/50 border border-amber-200 rounded-lg text-sm">
          <option value="all">All Dates</option>
          {dates.map(d=><option key={d} value={d}>{fmtDate(d)}</option>)}
        </select>
        <select value={filter.branch} onChange={e=>setFilter({...filter,branch:e.target.value})} className="px-3 py-2 bg-amber-50/50 border border-amber-200 rounded-lg text-sm">
          <option value="all">All Branches</option>
          {BRANCHES.map(b=><option key={b} value={b}>{b}</option>)}
        </select>
        <select value={filter.status} onChange={e=>setFilter({...filter,status:e.target.value})} className="px-3 py-2 bg-amber-50/50 border border-amber-200 rounded-lg text-sm">
          <option value="all">All Statuses</option>
          <option value="delivered">Delivered</option>
          <option value="transit">In Transit</option>
        </select>
        <select value={filter.shift} onChange={e=>setFilter({...filter,shift:e.target.value})} className="px-3 py-2 bg-amber-50/50 border border-amber-200 rounded-lg text-sm">
          <option value="all">All Shifts</option>
          {SHIFTS.map(s=><option key={s} value={s}>{s}</option>)}
        </select>
      </div>

      {/* Desktop table */}
      <div className="hidden md:block bg-white border-2 border-amber-200 rounded-xl overflow-hidden">
        <div className="overflow-x-auto">
          <table className="w-full text-sm">
            <thead className="bg-amber-100 border-b-2 border-amber-200">
              <tr className="text-left">
                {['Entry','Collection Name','Vehicle','Branch','From → To','Shift / Incharge','Driver','Out → In','Duration','Status',''].map(h=>(
                  <th key={h} className="px-3 py-2.5 font-mono text-[10px] font-bold text-amber-900 tracking-wider uppercase">{h}</th>
                ))}
              </tr>
            </thead>
            <tbody className="divide-y divide-amber-100">
              {filtered.map(e => (
                <tr key={e.id} className="hover:bg-amber-50/50">
                  <td className="px-3 py-2.5"><div className="font-mono text-xs text-slate-500">{e.id}</div><div className="text-xs text-slate-400">{fmtDate(e.date)}</div></td>
                  <td className="px-3 py-2.5"><div className="text-sm font-semibold text-slate-800">{e.collectionName||'—'}</div></td>
                  <td className="px-3 py-2.5 font-extrabold">{e.vehicleNo}</td>
                  <td className="px-3 py-2.5"><span className="font-mono text-xs font-bold px-2 py-0.5 rounded bg-amber-100 text-amber-800">{e.branch}</span></td>
                  <td className="px-3 py-2.5"><div className="text-xs text-slate-600">{e.fromLoc}</div><div className="text-xs text-slate-400">↓ {e.toLoc}</div></td>
                  <td className="px-3 py-2.5"><div className="text-xs font-bold">{e.shift}</div><div className="text-xs text-slate-500">{e.incharge}</div></td>
                  <td className="px-3 py-2.5"><div className="text-xs font-bold">{e.driverName}</div><div className="text-xs text-slate-500 font-mono">{e.driverMobile}</div></td>
                  <td className="px-3 py-2.5 font-mono text-xs tabular-nums"><div className="text-green-700">{fmtTime(e.outTime)}</div><div className="text-slate-500">{fmtTime(e.inTime)}</div></td>
                  <td className="px-3 py-2.5 font-mono text-xs font-bold">{fmtDur(e.outTime, e.inTime)}</td>
                  <td className="px-3 py-2.5"><StatusPill status={e.status}/></td>
                  <td className="px-3 py-2.5 text-right"><button onClick={()=>onEdit(e)} className="text-amber-700 hover:text-amber-900 text-xs font-bold">Edit</button></td>

            </tbody>

        </div>

      {/* Mobile cards */}
      <div className="md:hidden space-y-2">
        {filtered.map(e => (
          <button key={e.id} onClick={()=>onEdit(e)} className="w-full text-left bg-white border-2 border-amber-200 rounded-xl p-3.5">
            <div className="flex justify-between items-start mb-2">
              <div>
                <div className="flex items-center gap-2 flex-wrap">
                  <span className="font-extrabold">{e.vehicleNo}</span>
                  <span className="font-mono text-[10px] font-bold px-1.5 py-0.5 rounded bg-amber-100 text-amber-800">{e.branch}</span>
                </div>
                {e.collectionName && <div className="text-xs font-semibold text-amber-700 mt-0.5">{e.collectionName}</div>}
                <div className="text-xs text-slate-500 mt-0.5">{e.id} · {fmtDate(e.date)}</div>
              </div>
              <StatusPill status={e.status}/>
            </div>
            <div className="text-xs text-slate-600 space-y-0.5"><div>🟢 {e.fromLoc}</div><div>🔴 {e.toLoc}</div></div>
            <div className="mt-2 pt-2 border-t border-amber-100 flex justify-between text-xs">
              <span className="text-slate-500">{e.driverName} · {e.shift} · {e.incharge}</span>
              <span className="font-mono font-bold">{fmtDur(e.outTime, e.inTime)}</span>
            </div>
          </button>
        ))}
        {filtered.length===0 && <EmptyState text="No entries match your filters."/>}
      </div>
    </div>
  );
}

const StatusPill = ({ status }) => status==='delivered' ? (
  <span className="inline-flex items-center gap-1.5 bg-green-100 text-green-800 px-2 py-1 rounded-full text-xs font-bold">
    <svg className="w-3 h-3" fill="none" stroke="currentColor" strokeWidth="3" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg>Delivered
  </span>
) : (
  <span className="inline-flex items-center gap-1.5 bg-amber-100 text-amber-800 px-2 py-1 rounded-full text-xs font-bold">
    <span className="w-1.5 h-1.5 bg-amber-500 rounded-full pulse-dot"></span>In Transit
  </span>
);

/* =========================================================================
   SEARCHABLE DROPDOWN
   ========================================================================= */
function SearchableDropdown({ options, value, onChange, placeholder }) {
  const [open, setOpen] = useState(false);
  const [query, setQuery] = useState('');
  const ref = useRef(null);
  useEffect(() => {
    const h = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', h);
    return () => document.removeEventListener('mousedown', h);
  }, []);
  const filtered = options.filter(o=>o.toLowerCase().includes(query.toLowerCase()));
  return (
    <div ref={ref} className="relative">
      <button type="button" onClick={()=>{ setOpen(!open); setQuery(''); }}
        className="w-full px-3 py-2.5 border border-slate-300 rounded-lg flex items-center justify-between bg-white hover:border-amber-400 text-left">
        <span className={value?'text-slate-900 font-semibold':'text-slate-400'}>{value||placeholder}</span>
        <svg className={`w-4 h-4 text-slate-400 transition-transform ${open?'rotate-180':''}`} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M19 9l-7 7-7-7"/></svg>
      </button>
      {open && (
        <div className="absolute top-full left-0 right-0 mt-1 bg-white border-2 border-amber-300 rounded-lg shadow-xl z-20 fade-in overflow-hidden">
          <input autoFocus value={query} onChange={e=>setQuery(e.target.value)} placeholder="Type to search..." className="w-full px-3 py-2 border-b border-amber-200 text-sm"/>
          <div className="max-h-48 overflow-y-auto">
            {filtered.map(opt=>(
              <button key={opt} type="button" onClick={()=>{onChange(opt);setOpen(false);setQuery('');}}
                className={`w-full text-left px-3 py-2 text-sm hover:bg-amber-50 ${value===opt?'bg-amber-100 font-bold':''}`}>{opt}</button>
            ))}
            {filtered.length===0 && <div className="px-3 py-3 text-sm text-slate-400 text-center">No matches</div>}
          </div>
        </div>
      )}
    </div>
  );
}

/* ---- Single entry form ---- */
function SingleEntryForm({ entry, onClose, isEdit }) {
  const { addEntry, updateEntry, deleteEntry, entries } = useData();
  const [form, setForm] = useState(entry
    ? {...entry, collectionName: entry.collectionName||''}
    : { type:'collection', date:todayStr(), collectionName:'', vehicleNo:'', fromLoc:'', toLoc:'', branch:'', shift:'Day', incharge:'', driverName:'', driverMobile:'', outTime:'', inTime:'', status:'transit', remarks:'' }
  );
  const [errors,  setErrors]  = useState({});
  const [saving,  setSaving]  = useState(false);

  const setNow = (field) => {
    const d = new Date(), p = n => String(n).padStart(2,'0');
    setForm({...form, [field]: `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`});
  };

  const validate = () => {
    const e = {};
    if (!form.collectionName?.trim()) e.collectionName='Required';
    if (!form.vehicleNo.trim())       e.vehicleNo='Required';
    if (!form.branch)                 e.branch='Required';
    if (!form.fromLoc.trim())         e.fromLoc='Required';
    if (!form.toLoc.trim())           e.toLoc='Required';
    if (!form.incharge)               e.incharge='Required';
    if (!form.driverName.trim())      e.driverName='Required';
    if (!form.driverMobile.trim())    e.driverMobile='Required';
    if (!form.outTime)                e.outTime='Required';
    if (form.status==='delivered'&&!form.inTime) e.inTime='Required for delivered';
    if (form.inTime&&form.outTime&&new Date(form.inTime)<new Date(form.outTime)) e.inTime='Must be after out-time';
    setErrors(e);
    return Object.keys(e).length===0;
  };

  const save = async () => {
    if (!validate()) return;
    setSaving(true);
    try {
      if (isEdit) await updateEntry(entry.id, form);
      else        await addEntry({ ...form, id: genId(), createdAt: new Date().toISOString() });
      onClose();
    } catch(err) { alert('Save failed: '+err.message); setSaving(false); }
  };

  const markDelivered = () => setForm(f=>({...f, status:'delivered', inTime: f.inTime||toLocalInput(new Date().toISOString())}));

  const remove = async () => {
    if (!confirm('Delete this entry?')) return;
    try { await deleteEntry(entry.id); onClose(); }
    catch(err) { alert('Delete failed: '+err.message); }
  };

  return (
    <>
      <div className="flex-1 overflow-y-auto px-5 md:px-6 py-5 space-y-4">
        {/* Collection badge */}
        <div className="flex items-center gap-3 bg-blue-50 border-2 border-blue-200 rounded-xl px-4 py-3">
          <span className="text-2xl">📥</span>
          <div><div className="font-extrabold text-blue-900">Collection</div><div className="text-xs text-blue-600">Inbound goods to branch / hub</div></div>
        </div>

        <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
          <Field label="Collection Name" error={errors.collectionName} required>
            <input value={form.collectionName||''} onChange={e=>setForm({...form,collectionName:e.target.value})} placeholder="e.g. Morning Pickup Run" className="w-full px-3 py-2.5 border border-slate-300 rounded-lg"/>
          </Field>
          <Field label="Vehicle No." error={errors.vehicleNo} required>
            <input value={form.vehicleNo} onChange={e=>setForm({...form,vehicleNo:e.target.value.toUpperCase()})} placeholder="TN-09-AB-1234" className="w-full px-3 py-2.5 border border-slate-300 rounded-lg font-mono"/>
          </Field>
        </div>

        <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
          <Field label="Date" required>
            <input type="date" value={form.date} onChange={e=>setForm({...form,date:e.target.value})} className="w-full px-3 py-2.5 border border-slate-300 rounded-lg"/>
          </Field>
          <Field label="Branch" error={errors.branch} required>
            <SearchableDropdown options={BRANCHES} value={form.branch} onChange={v=>setForm({...form,branch:v})} placeholder="Select branch"/>
          </Field>
        </div>

        <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
          <Field label="From Company" error={errors.fromLoc} required>
            <input value={form.fromLoc} onChange={e=>setForm({...form,fromLoc:e.target.value})} placeholder="Company / vendor name" className="w-full px-3 py-2.5 border border-slate-300 rounded-lg"/>
          </Field>
          <Field label="To Branch" error={errors.toLoc} required>
            <input value={form.toLoc} onChange={e=>setForm({...form,toLoc:e.target.value})} placeholder="Destination hub / branch" className="w-full px-3 py-2.5 border border-slate-300 rounded-lg"/>
          </Field>
        </div>

        <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
          <Field label="Shift" required>
            <div className="grid grid-cols-2 gap-1.5">
              {SHIFTS.map(s=>(
                <button key={s} type="button" onClick={()=>setForm({...form,shift:s})}
                  className={`py-2.5 px-2 rounded-lg text-sm font-bold border-2 flex items-center justify-center gap-1.5 ${form.shift===s?'bg-amber-500 border-amber-500 text-white':'border-slate-300 hover:border-amber-400 hover:bg-amber-50'}`}>
                  <span>{s==='Day'?'☀️':'🌙'}</span>{s}
                </button>
              ))}
            </div>
          </Field>
          <Field label="Shift Incharge" error={errors.incharge} required>
            <SearchableDropdown options={INCHARGES} value={form.incharge} onChange={v=>setForm({...form,incharge:v})} placeholder="Select incharge"/>
          </Field>
        </div>

        <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
          <Field label="Driver Name" error={errors.driverName} required>
            <input value={form.driverName} onChange={e=>setForm({...form,driverName:e.target.value})} placeholder="Full name" className="w-full px-3 py-2.5 border border-slate-300 rounded-lg"/>

          <Field label="Mobile Number" error={errors.driverMobile} required>
            <input type="tel" value={form.driverMobile} onChange={e=>setForm({...form,driverMobile:e.target.value})} placeholder="+91-XXXXX-XXXXX" className="w-full px-3 py-2.5 border border-slate-300 rounded-lg font-mono"/>
          </Field>
        </div>

        <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
          <Field label="Out Time" error={errors.outTime} required>

              <input type="datetime-local" value={form.outTime} onChange={e=>setForm({...form,outTime:e.target.value})} className="flex-1 px-3 py-2.5 border border-slate-300 rounded-lg"/>

            </div>

        </div>

        {form.outTime && form.inTime && (
          <div className="bg-amber-100 border-2 border-amber-300 rounded-lg px-3 py-2 text-sm flex justify-between items-center">
            <span className="text-amber-700 font-semibold">⏱ Turnaround</span>
            <span className="font-mono font-extrabold text-amber-900">{fmtDur(form.outTime, form.inTime)}</span>
          </div>
        )}

        <Field label="Status" required>
          <div className="grid grid-cols-2 gap-2">
            <button type="button" onClick={()=>setForm({...form,status:'transit'})}
              className={`p-3 rounded-lg border-2 text-left ${form.status==='transit'?'bg-amber-50 border-amber-500':'border-slate-300 hover:border-amber-300'}`}>
              <div className="flex items-center gap-2 font-bold"><span className="w-2 h-2 bg-amber-500 rounded-full pulse-dot"></span>In Transit</div>
              <div className="text-xs text-slate-500 mt-0.5">Currently on route</div>

              className={`p-3 rounded-lg border-2 text-left ${form.status==='delivered'?'bg-green-50 border-green-500':'border-slate-300 hover:border-green-300'}`}>
              <div className="flex items-center gap-2 font-bold">
                <svg className="w-4 h-4 text-green-600" fill="none" stroke="currentColor" strokeWidth="3" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg>Delivered
              </div>
              <div className="text-xs text-slate-500 mt-0.5">Trip completed</div>
            </button>
          </div>
        </Field>

        <Field label="Remarks (optional)">
          <textarea value={form.remarks} onChange={e=>setForm({...form,remarks:e.target.value})} rows={2} placeholder="Any notes..." className="w-full px-3 py-2.5 border border-slate-300 rounded-lg resize-none"/>
        </Field>
      </div>

      <div className="px-5 md:px-6 py-3.5 border-t-2 border-amber-200 bg-amber-50 md:rounded-b-2xl flex gap-2 sticky bottom-0">
        {isEdit && <button onClick={remove} className="px-3 py-2.5 text-red-600 hover:bg-red-50 rounded-lg text-sm font-bold">Delete</button>}
        <div className="flex-1"></div>
        <button onClick={onClose} className="px-4 py-2.5 border-2 border-slate-300 rounded-lg text-sm font-bold hover:bg-white">Cancel</button>
        <button onClick={save} disabled={saving} className="btn-primary px-5 py-2.5 rounded-lg text-sm">
          {saving ? 'Saving...' : (isEdit ? 'Save Changes' : 'Log Entry')}
        </button>
      </div>
    </>
  );
}

/* =========================================================================
   BULK UPLOAD (Excel / CSV)
   ========================================================================= */
function BulkUploadForm({ onClose }) {
  const { addEntries } = useData();
  const [rows,     setRows]     = useState([]); // parsed rows ready to preview
  const [errors,   setErrors]   = useState([]); // per-row errors
  const [uploading,setUploading]= useState(false);
  const [dragOver, setDragOver] = useState(false);
  const fileRef = useRef(null);

  /* --- column aliases (flexible header matching) --- */
  const colMap = {
    date:           ['date','Date','DATE'],
    collectionName: ['collection name','collection_name','Collection Name','Collection','COLLECTION NAME'],
    vehicleNo:      ['vehicle no','vehicle_no','Vehicle No','vehicleno','Vehicle','VEHICLE NO','vehicle no.'],
    branch:         ['branch','Branch','BRANCH'],
    fromLoc:        ['from','from company','from_company','from loc','From','FROM','From Company'],
    toLoc:          ['to','to branch','to_branch','to loc','To','TO','To Branch'],
    shift:          ['shift','Shift','SHIFT'],
    incharge:       ['incharge','in-charge','Incharge','shift incharge','Shift Incharge','INCHARGE'],
    driverName:     ['driver name','driver_name','Driver Name','driver','Driver','DRIVER NAME'],
    driverMobile:   ['mobile','mobile number','Mobile','Mobile Number','driver mobile','Driver Mobile','MOBILE'],
    outTime:        ['out time','out_time','Out Time','out','OUT TIME'],
    inTime:         ['in time','in_time','In Time','in','IN TIME'],
    status:         ['status','Status','STATUS'],
    remarks:        ['remarks','Remarks','REMARKS','notes','Notes'],
  };

  const resolveHeader = (raw) => {
    const lower = raw.toLowerCase().trim();
    for (const [field, aliases] of Object.entries(colMap)) {
      if (aliases.some(a => a.toLowerCase() === lower)) return field;
    }
    return null;
  };

  const parseFile = (file) => {
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const wb = XLSX.read(ev.target.result, { type:'binary', cellDates:true });
        const ws = wb.Sheets[wb.SheetNames[0]];
        const raw = XLSX.utils.sheet_to_json(ws, { defval:'' });

        if (raw.length === 0) { alert('Sheet is empty.'); return; }

        // map headers
        const sample = raw[0];
        const headerMap = {};
        for (const key of Object.keys(sample)) {
          const field = resolveHeader(key);
          if (field) headerMap[field] = key;
        }

        const parsed = [];
        const errs   = [];

        raw.forEach((row, idx) => {
          const get = (field) => {
            const key = headerMap[field];
            return key ? String(row[key]||'').trim() : '';
          };

          // date handling — XLSX may give a JS Date object
          let dateVal = get('date');
          if (!dateVal) {
            const key = headerMap['date'];
            if (key && row[key] instanceof Date) {
              dateVal = row[key].toISOString().slice(0,10);
            }
          }
          if (dateVal && dateVal.includes('/')) {
            // try dd/mm/yyyy
            const [d,m,y] = dateVal.split('/');
            if (y) dateVal = `${y}-${m.padStart(2,'0')}-${d.padStart(2,'0')}`;
          }

          const rowErrs = [];
          if (!dateVal)         rowErrs.push('date missing');
          if (!get('vehicleNo'))  rowErrs.push('vehicle no missing');
          if (!get('fromLoc'))    rowErrs.push('from location missing');
          if (!get('toLoc'))      rowErrs.push('to location missing');

          const shift = get('shift') || 'Day';
          if (!SHIFTS.includes(shift)) rowErrs.push(`invalid shift "${shift}" (use Day or Night)`);

          const branch = get('branch');
          if (branch && !BRANCHES.includes(branch)) rowErrs.push(`unknown branch "${branch}"`);

          if (rowErrs.length) errs.push({ row: idx+2, msgs: rowErrs });

          // parse time strings like "08:30" or "08:30 AM"
          const parseTime = (timeStr, refDate) => {
            if (!timeStr || timeStr==='—') return null;
            if (timeStr instanceof Date) return timeStr.toISOString();
            // "HH:MM" or "HH:MM AM/PM"
            const t = String(timeStr).trim();
            if (!t) return null;
            const base = refDate || dateVal || todayStr();
            try {
              const d = new Date(`${base}T${t.length<=5 ? t+':00' : t}`);
              if (!isNaN(d)) return d.toISOString();
            } catch(_) {}
            return null;
          };

          parsed.push({
            id: genId(),
            date: dateVal,
            type: 'collection',
            collectionName: get('collectionName'),
            vehicleNo: get('vehicleNo').toUpperCase(),
            branch: branch,
            fromLoc: get('fromLoc'),
            toLoc: get('toLoc'),
            shift: shift,
            incharge: get('incharge'),
            driverName: get('driverName'),
            driverMobile: get('driverMobile'),
            outTime: parseTime(get('outTime'), dateVal),
            inTime:  parseTime(get('inTime'),  dateVal),
            status: (get('status')||'transit').toLowerCase().includes('deliver') ? 'delivered' : 'transit',
            remarks: get('remarks'),
            createdAt: new Date().toISOString(),
            _rowErrs: rowErrs,
          });
        });

        setRows(parsed);
        setErrors(errs);
      } catch(e) {
        alert('Could not read file: '+e.message);
      }
    };
    reader.readAsBinaryString(file);
  };

  const handleFile = (file) => {
    if (!file) return;
    const ok = file.name.match(/\.(xlsx|xls|csv)$/i);
    if (!ok) { alert('Please upload an .xlsx, .xls, or .csv file.'); return; }
    parseFile(file);
  };

  const upload = async () => {
    const validRows = rows.filter(r => r._rowErrs.length===0);
    if (validRows.length===0) { alert('No valid rows to upload.'); return; }
    setUploading(true);
    try {
      await addEntries(validRows.map(({_rowErrs, ...r}) => r));
      onClose();
    } catch(e) { alert('Upload failed: '+e.message); setUploading(false); }
  };

  const downloadTemplate = () => {
    const ws = XLSX.utils.aoa_to_sheet([
      ['Date','Collection Name','Vehicle No','Branch','From Company','To Branch','Shift','Incharge','Driver Name','Mobile Number','Out Time','In Time','Status','Remarks'],
      ['2026-05-13','Morning Run','TN-09-AB-1234','TVK','Sundaram Textiles','TVK Hub','Day','Vinoth','Suresh Kumar','+91-98400-11111','07:30','09:45','delivered',''],
      ['2026-05-13','Evening Pickup','TN-09-CD-5678','RNT','Anand Electronics','RNT Hub','Night','Mani','Raj Pillai','+91-98400-22222','20:00','','transit','COD order'],
    ]);
    ws['!cols'] = Array(14).fill({ wch:20 });
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Entries');
    XLSX.writeFile(wb, 'uddhava-bulk-template.xlsx');
  };

  return (
    <>
      <div className="flex-1 overflow-y-auto px-5 md:px-6 py-5 space-y-5">
        {/* Instructions */}
        <div className="bg-blue-50 border-2 border-blue-200 rounded-xl p-4 text-sm space-y-2">
          <div className="font-bold text-blue-900 flex items-center gap-2">📊 Excel / CSV Bulk Upload</div>
          <p className="text-blue-800">Upload multiple collection entries at once using an Excel (.xlsx) or CSV file.</p>
          <div className="text-blue-700">
            <strong>Required columns:</strong> Date, Vehicle No, From Company, To Branch<br/>
            <strong>Optional:</strong> Collection Name, Branch, Shift, Incharge, Driver Name, Mobile Number, Out Time, In Time, Status, Remarks
          </div>
          <button onClick={downloadTemplate}
            className="inline-flex items-center gap-1.5 px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-xs font-bold">
            <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2M7 10l5 5 5-5M12 15V3"/></svg>
            Download Template
          </button>
        </div>

        {/* Drop zone */}
        {rows.length === 0 && (
          <div
            className={`drop-zone rounded-xl p-8 text-center cursor-pointer ${dragOver?'drag-over':''}`}
            onDragOver={e=>{ e.preventDefault(); setDragOver(true); }}
            onDragLeave={()=>setDragOver(false)}
            onDrop={e=>{ e.preventDefault(); setDragOver(false); handleFile(e.dataTransfer.files[0]); }}
            onClick={()=>fileRef.current?.click()}
          >
            <div className="text-4xl mb-3">📂</div>
            <div className="font-bold text-slate-700 mb-1">Drop your Excel or CSV file here</div>
            <div className="text-sm text-slate-500">or click to browse</div>
            <div className="mt-3 font-mono text-xs text-slate-400">.xlsx · .xls · .csv</div>
            <input ref={fileRef} type="file" accept=".xlsx,.xls,.csv" className="hidden" onChange={e=>handleFile(e.target.files[0])}/>
          </div>
        )}

        {/* Preview */}
        {rows.length > 0 && (
          <div className="space-y-3">
            <div className="flex items-center justify-between">
              <div>
                <div className="font-bold text-slate-900">{rows.length} rows parsed</div>
                <div className="text-sm text-slate-500">
                  <span className="text-green-700 font-semibold">{rows.filter(r=>r._rowErrs.length===0).length} valid</span>
                  {errors.length > 0 && <span className="text-red-600 font-semibold ml-2">{errors.length} with errors</span>}
                </div>
              </div>
              <button onClick={()=>{ setRows([]); setErrors([]); }} className="text-xs font-bold text-slate-500 hover:text-red-600 border border-slate-200 px-2 py-1 rounded-lg">
                ✕ Clear
              </button>
            </div>

            {/* Error list */}
            {errors.length > 0 && (
              <div className="bg-red-50 border-2 border-red-200 rounded-xl p-3 space-y-1 max-h-32 overflow-y-auto">
                {errors.map((e,i) => (
                  <div key={i} className="text-xs text-red-700">
                    <span className="font-mono font-bold">Row {e.row}:</span> {e.msgs.join(', ')}
                  </div>
                ))}
              </div>
            )}

            {/* Preview table */}
            <div className="bg-white border-2 border-amber-200 rounded-xl overflow-hidden max-h-72 overflow-y-auto">
              <table className="w-full text-xs">
                <thead className="bg-amber-100 sticky top-0">
                  <tr>
                    {['#','Date','Collection','Vehicle','Branch','From','To','Shift','Driver','Status'].map(h=>(
                      <th key={h} className="px-2 py-2 text-left font-bold text-amber-900 whitespace-nowrap">{h}</th>
                    ))}
                    <th className="px-2 py-2"></th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-amber-100">
                  {rows.map((r,i) => (
                    <tr key={i} className={r._rowErrs.length>0 ? 'bg-red-50' : 'hover:bg-amber-50/30'}>
                      <td className="px-2 py-2 font-mono text-slate-400">{i+2}</td>
                      <td className="px-2 py-2">{r.date}</td>
                      <td className="px-2 py-2 max-w-[100px] truncate">{r.collectionName||'—'}</td>
                      <td className="px-2 py-2 font-mono font-bold">{r.vehicleNo}</td>
                      <td className="px-2 py-2"><span className="bg-amber-100 text-amber-800 px-1.5 rounded font-mono font-bold">{r.branch||'—'}</span></td>
                      <td className="px-2 py-2 max-w-[80px] truncate">{r.fromLoc}</td>
                      <td className="px-2 py-2 max-w-[80px] truncate">{r.toLoc}</td>
                      <td className="px-2 py-2">{r.shift}</td>
                      <td className="px-2 py-2 max-w-[80px] truncate">{r.driverName||'—'}</td>
                      <td className="px-2 py-2"><StatusPill status={r.status}/></td>
                      <td className="px-2 py-2">
                        {r._rowErrs.length>0
                          ? <span title={r._rowErrs.join(', ')} className="text-red-600 cursor-help">⚠</span>
                          : <span className="text-green-600">✓</span>}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        )}
      </div>

      <div className="px-5 md:px-6 py-3.5 border-t-2 border-amber-200 bg-amber-50 md:rounded-b-2xl flex gap-2 sticky bottom-0">
        <div className="flex-1"></div>
        <button onClick={onClose} className="px-4 py-2.5 border-2 border-slate-300 rounded-lg text-sm font-bold hover:bg-white">Cancel</button>
        {rows.length > 0 && (
          <button onClick={upload} disabled={uploading || rows.filter(r=>r._rowErrs.length===0).length===0}
            className="btn-primary px-5 py-2.5 rounded-lg text-sm">
            {uploading ? 'Uploading...' : `Upload ${rows.filter(r=>r._rowErrs.length===0).length} Entries`}
          </button>
        )}
      </div>
    </>
  );
}

function Field({ label, error, required, children }) {

    <div>
      <label className="block text-xs font-bold text-slate-700 mb-1.5">

}

/* =========================================================================
   BAR CHART
   ========================================================================= */
function BarChart({ data }) {
  const [hovered, setHovered] = useState(null);
  const CHART_H=220, PAD_L=36, PAD_R=12, PAD_T=20, PAD_B=36;
  const chartH = CHART_H - PAD_T - PAD_B;
  const maxVal = Math.max(...data.map(d=>d.total), 1);
  const gridMax = Math.ceil(maxVal/5)*5 || 5;
  const gridLines = 5;
  const yLabels = Array.from({length:gridLines+1},(_,i)=>Math.round((gridLines-i)*gridMax/gridLines));
  const svgW = Math.max(480, data.length*80+PAD_L+PAD_R);

  return (
    <div className="w-full overflow-x-auto">
      <svg viewBox={`0 0 ${svgW} ${CHART_H}`} className="w-full" style={{minWidth:`${svgW}px`,height:`${CHART_H}px`}}>
        {yLabels.map((val,i)=>{
          const y = PAD_T+(i/gridLines)*chartH;
          return <g key={val}>
            <line x1={PAD_L} x2={svgW-PAD_R} y1={y} y2={y} stroke="#fde68a" strokeWidth="1" strokeDasharray={i===gridLines?'0':'4 3'}/>
            <text x={PAD_L-6} y={y+4} textAnchor="end" fontSize="9" fill="#94a3b8" fontFamily="JetBrains Mono,monospace">{val}</text>
          </g>;
        })}
        {data.map((d,idx)=>{
          const slotW = (svgW-PAD_L-PAD_R)/data.length;
          const bw = (slotW*0.65)/3-1;
          const x0 = PAD_L+idx*slotW+slotW*0.175;
          const yBase = PAD_T+chartH;
          const tH = chartH*(d.total/gridMax);
          const dH = chartH*(d.delivered/gridMax);
          const trH = chartH*(d.transit/gridMax);
          const lbl = new Date(d.date).toLocaleDateString('en-IN',{day:'2-digit',month:'short'});
          const isH = hovered===idx;
          return (
            <g key={d.date} onMouseEnter={()=>setHovered(idx)} onMouseLeave={()=>setHovered(null)} style={{cursor:'pointer'}}>
              {isH && <rect x={PAD_L+idx*slotW} y={PAD_T} width={slotW} height={chartH} fill="#fef3c7" rx="4"/>}
              {/* Total */}
              <rect x={x0} y={yBase-tH} width={bw} height={Math.max(tH,2)} rx="3" fill={isH?'#f59e0b':'#fbbf24'}/>
              <text x={x0+bw/2} y={yBase-tH-5} textAnchor="middle" fontSize="9" fontWeight="700" fill="#92400e" fontFamily="JetBrains Mono,monospace">{d.total}</text>
              {/* Delivered */}
              <rect x={x0+bw+1} y={yBase-dH} width={bw} height={Math.max(dH,2)} rx="3" fill={isH?'#16a34a':'#22c55e'}/>
              {d.delivered>0 && <text x={x0+bw*1.5+1} y={yBase-dH-5} textAnchor="middle" fontSize="9" fontWeight="700" fill="#14532d" fontFamily="JetBrains Mono,monospace">{d.delivered}</text>}
              {/* Transit */}
              <rect x={x0+bw*2+2} y={yBase-trH} width={bw} height={Math.max(trH,2)} rx="3" fill={isH?'#f59e0b60':'#fde68a'}/>
              {d.transit>0 && <text x={x0+bw*2.5+2} y={yBase-trH-5} textAnchor="middle" fontSize="9" fontWeight="700" fill="#78350f" fontFamily="JetBrains Mono,monospace">{d.transit}</text>}
              {/* X label */}
              <text x={x0+bw*1.5} y={yBase+16} textAnchor="middle" fontSize="10" fill="#64748b" fontFamily="JetBrains Mono,monospace">{lbl}</text>
              {/* Tooltip */}
              {isH && (
                <g>
                  <rect x={Math.min(x0,svgW-140)} y={PAD_T} width="128" height="64" rx="6" fill="#1e293b" opacity="0.96"/>
                  <text x={Math.min(x0,svgW-140)+8} y={PAD_T+16} fontSize="10" fontWeight="700" fill="#fbbf24" fontFamily="JetBrains Mono,monospace">{lbl}</text>
                  <text x={Math.min(x0,svgW-140)+8} y={PAD_T+32} fontSize="9" fill="#e2e8f0" fontFamily="JetBrains Mono,monospace">Total: {d.total}</text>
                  <text x={Math.min(x0,svgW-140)+8} y={PAD_T+46} fontSize="9" fill="#86efac" fontFamily="JetBrains Mono,monospace">Delivered: {d.delivered}</text>
                  <text x={Math.min(x0,svgW-140)+8} y={PAD_T+60} fontSize="9" fill="#fcd34d" fontFamily="JetBrains Mono,monospace">Transit: {d.transit}</text>
                </g>
              )}
            </g>
          );
        })}
        <line x1={PAD_L} x2={PAD_L} y1={PAD_T} y2={PAD_T+chartH} stroke="#fcd34d" strokeWidth="1.5"/>
        <line x1={PAD_L} x2={svgW-PAD_R} y1={PAD_T+chartH} y2={PAD_T+chartH} stroke="#fcd34d" strokeWidth="1.5"/>
      </svg>
    </div>
  );
}

/* =========================================================================
   REPORTS
   ========================================================================= */
function ReportsPage() {
  const { entries } = useData();
  const byDate = useMemo(()=>{
    const m={};
    entries.forEach(e=>{
      if(!m[e.date])m[e.date]={date:e.date,total:0,delivered:0,transit:0};
      m[e.date].total++;
      if(e.status==='delivered')m[e.date].delivered++; else m[e.date].transit++;
    });
    return Object.values(m).sort((a,b)=>a.date.localeCompare(b.date));
  },[entries]);
  const byDriver = useMemo(()=>{
    const m={};
    entries.forEach(e=>{
      if(!m[e.driverName])m[e.driverName]={name:e.driverName,mobile:e.driverMobile,total:0,delivered:0,totalMin:0,done:0};
      m[e.driverName].total++;
      if(e.status==='delivered'){m[e.driverName].delivered++;if(e.outTime&&e.inTime){m[e.driverName].totalMin+=(new Date(e.inTime)-new Date(e.outTime))/60000;m[e.driverName].done++;}}
    });
    return Object.values(m).map(d=>({...d,avgMin:d.done?Math.round(d.totalMin/d.done):0})).sort((a,b)=>b.delivered-a.delivered);
  },[entries]);
  const byBranch = useMemo(()=>BRANCHES.map(b=>({branch:b,trips:entries.filter(e=>e.branch===b).length,delivered:entries.filter(e=>e.branch===b&&e.status==='delivered').length})).filter(b=>b.trips>0).sort((a,b)=>b.trips-a.trips),[entries]);
  const byIncharge = useMemo(()=>INCHARGES.map(i=>({name:i,trips:entries.filter(e=>e.incharge===i).length,delivered:entries.filter(e=>e.incharge===i&&e.status==='delivered').length})).filter(x=>x.trips>0).sort((a,b)=>b.trips-a.trips),[entries]);

  return (
    <div className="p-4 md:p-6 space-y-6 max-w-7xl mx-auto">
      <div>
        <h2 className="text-2xl font-extrabold">Reports & Analytics</h2>
        <p className="text-slate-500 text-sm">Performance across drivers, vehicles, branches, and incharges</p>
      </div>

      <div className="bg-white border-2 border-amber-200 rounded-xl p-5">
        <div className="flex items-start justify-between mb-5">
          <div><h3 className="font-extrabold text-slate-900">Daily Trip Volume</h3><p className="text-xs text-slate-500 mt-0.5">Collections vs delivered per day</p></div>
          <div className="flex items-center gap-3 text-xs">
            <span className="flex items-center gap-1.5"><span className="w-3 h-3 rounded bg-amber-400"></span>Total</span>
            <span className="flex items-center gap-1.5"><span className="w-3 h-3 rounded bg-green-500"></span>Delivered</span>
            <span className="flex items-center gap-1.5"><span className="w-3 h-3 rounded bg-amber-200"></span>Transit</span>
          </div>
        </div>
        {byDate.length===0 ? <div className="h-48 flex items-center justify-center text-slate-400">No data yet</div> : <BarChart data={byDate}/>}
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
        <div className="bg-white border-2 border-amber-200 rounded-xl p-5">
          <h3 className="font-extrabold mb-4">Driver Performance</h3>
          <div className="space-y-2.5">
            {byDriver.map((d,i)=>(
              <div key={d.name} className="flex items-center gap-3">
                <div className={`w-8 h-8 rounded-full flex items-center justify-center font-extrabold text-sm shrink-0 ${i===0?'bg-amber-400 text-amber-900':i===1?'bg-slate-300':i===2?'bg-orange-300':'bg-amber-100 text-slate-600'}`}>{i+1}</div>
                <div className="flex-1 min-w-0"><div className="font-bold truncate">{d.name}</div><div className="text-xs text-slate-500 font-mono">{d.mobile}</div></div>
                <div className="text-right"><div className="font-extrabold tabular-nums"><span className="text-amber-700">{d.delivered}</span><span className="text-slate-400">/{d.total}</span></div><div className="text-xs text-slate-500">Avg {d.avgMin}m</div></div>
              </div>
            ))}
            {byDriver.length===0 && <div className="text-center text-slate-400 text-sm py-4">No data yet</div>}
          </div>
        </div>

        <div className="bg-white border-2 border-amber-200 rounded-xl p-5">
          <h3 className="font-extrabold mb-4">Branch Activity</h3>
          <div className="space-y-2.5">
            {byBranch.map(b=>{
              const pct = b.trips?(b.delivered/b.trips)*100:0;
              return (
                <div key={b.branch}>
                  <div className="flex justify-between text-sm mb-1">
                    <span className="font-mono font-extrabold text-amber-800">{b.branch}</span>
                    <span className="font-mono tabular-nums"><span className="text-amber-700 font-bold">{b.delivered}</span><span className="text-slate-400"> / {b.trips}</span></span>
                  </div>
                  <div className="h-2 bg-amber-100 rounded-full overflow-hidden">
                    <div className="h-full bg-gradient-to-r from-amber-400 to-amber-600 rounded-full" style={{width:`${pct}%`}}></div>
                  </div>
                </div>
              );
            })}
            {byBranch.length===0 && <div className="text-center text-slate-400 text-sm py-4">No data yet</div>}
          </div>
        </div>

        <div className="bg-white border-2 border-amber-200 rounded-xl p-5 lg:col-span-2">
          <h3 className="font-extrabold mb-4">Incharge Workload</h3>
          <div className="grid grid-cols-2 md:grid-cols-3 gap-3">
            {byIncharge.map(i=>(
              <div key={i.name} className="bg-amber-50 border border-amber-200 rounded-lg p-3">
                <div className="font-bold">{i.name}</div>
                <div className="font-mono text-xs text-slate-500 mt-1"><span className="text-amber-700 font-bold">{i.delivered}</span> / {i.trips} trips</div>
              </div>
            ))}
            {byIncharge.length===0 && <div className="col-span-full text-center text-slate-400 text-sm py-4">No data yet</div>}
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>

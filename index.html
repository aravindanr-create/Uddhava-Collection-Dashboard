          color: toast.kind==='warn' ? '#fcd34d' : '#a3e635',
          animation:'toastIn .3s cubic-bezier(.16,1,.3,1)'
        }}>
          {toast.kind==='warn' ? '⚠' : '✓'} {toast.msg}
        </div>
      )}
    </div>
  );
}

/* ═══════════════════════════════════════════════════════
   DASHBOARD
═══════════════════════════════════════════════════════ */
function Dashboard({ onNew, onEdit, goEntries }) {
  const { entries } = useData();

  const latestDate = useMemo(()=>{
    const d=[...new Set(entries.map(e=>e.date))].sort().reverse();
    return d[0]||todayStr();
  },[entries]);

  const day       = entries.filter(e=>e.date===latestDate);
  const transit   = day.filter(e=>e.tripStatus==='transit');
  const delivered = day.filter(e=>e.tripStatus==='delivered');

  const collByStatus = useMemo(()=>COLL_STATUSES.map(s=>({
    ...s, count: day.filter(e=>e.collStatus===s.key).length
  })),[day]);

  const companyStats = useMemo(()=>KEY_COMPANY_NAMES.map(k=>({
    key:k,
    total:day.filter(e=>e.keyCompany===k).length,
    delivered:day.filter(e=>e.keyCompany===k&&e.tripStatus==='delivered').length,
    transit:day.filter(e=>e.keyCompany===k&&e.tripStatus==='transit').length,
    zones:ZONES.map(z=>({z,n:day.filter(e=>e.keyCompany===k&&e.zone===z).length})).filter(x=>x.n>0),
  })),[day]);

  const shiftStats = SHIFTS.map(s=>({
    s, total:day.filter(e=>e.shift===s).length,
    done:day.filter(e=>e.shift===s&&e.tripStatus==='delivered').length
  }));

  return (
    <div style={{display:'flex',flexDirection:'column',gap:'24px'}}>
      {/* Hero */}
      <div style={{
        background:'linear-gradient(135deg,#1e293b 0%,#0f172a 100%)',
        borderRadius:'var(--radius-xl)',padding:'28px 32px',position:'relative',overflow:'hidden',
        boxShadow:'0 8px 32px rgba(0,0,0,.18)'
      }}>
        <div style={{position:'absolute',inset:0,backgroundImage:'radial-gradient(circle at 80% 20%,rgba(251,191,36,.12) 0,transparent 50%)',pointerEvents:'none'}}></div>
        <div style={{position:'absolute',inset:0,backgroundImage:'radial-gradient(rgba(255,255,255,.03) 1px,transparent 1px)',backgroundSize:'24px 24px',pointerEvents:'none'}}></div>
        <div style={{position:'relative',display:'flex',flexWrap:'wrap',alignItems:'center',justifyContent:'space-between',gap:'16px',marginBottom:'24px'}}>
          <div>
            <div style={{display:'inline-flex',alignItems:'center',gap:'6px',background:'rgba(251,191,36,.15)',border:'1px solid rgba(251,191,36,.25)',borderRadius:'99px',padding:'4px 12px',marginBottom:'10px'}}>
              <span className="w-1.5 h-1.5 rounded-full pulse" style={{background:'#fbbf24',display:'inline-block'}}></span>
              <span className="mono" style={{fontSize:'10px',color:'#fbbf24',letterSpacing:'.1em',fontWeight:600}}>LIVE OPERATIONS</span>
            </div>
            <div style={{fontSize:'26px',fontWeight:700,color:'white',letterSpacing:'-.03em',lineHeight:1.2}}>
              {fmtDate(latestDate)}
            </div>
            <div style={{fontSize:'13px',color:'#94a3b8',marginTop:'4px'}}>
              <span style={{color:'white',fontWeight:600}}>{day.length}</span> entries
              {transit.length>0 && <span style={{color:'#fcd34d',fontWeight:600}}> · {transit.length} in transit</span>}
            </div>
          </div>
          <button onClick={onNew} className="btn desktop-only"
            style={{background:'#fbbf24',color:'#1a1a16',border:'none',fontWeight:700,padding:'10px 20px',boxShadow:'0 4px 14px rgba(251,191,36,.4)'}}>
            <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path d="M12 4v16m8-8H4"/></svg>
            New Entry
          </button>
        </div>

        {/* KPI row */}
        <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:'12px'}}>
          {[
            {label:'Total Today',   val:day.length,         sub:'All entries',   color:'#c084fc'},
            {label:'Collections',   val:day.filter(e=>e.type==='collection').length, sub:'Inbound', color:'#60a5fa'},
            {label:'In Transit',    val:transit.length,     sub:'On route',      color:'#fbbf24', pulse:true},
            {label:'Delivered',     val:delivered.length,   sub:'Completed',     color:'#4ade80'},
          ].map(k=>(
            <div key={k.label} style={{background:'rgba(255,255,255,.06)',borderRadius:'var(--radius-lg)',padding:'16px',border:'1px solid rgba(255,255,255,.08)',backdropFilter:'blur(4px)'}}>
              <div className="mono" style={{fontSize:'10px',color:'rgba(255,255,255,.45)',letterSpacing:'.08em',marginBottom:'8px'}}>{k.label.toUpperCase()}</div>
              <div style={{fontSize:'36px',fontWeight:700,color: k.val>0 ? k.color : 'rgba(255,255,255,.3)',lineHeight:1,letterSpacing:'-.04em'}}>
                {k.val}
                {k.pulse && k.val>0 && <span className="w-2 h-2 rounded-full pulse inline-block ml-2 mb-1" style={{background:k.color}}></span>}
              </div>
              <div style={{fontSize:'11px',color:'rgba(255,255,255,.3)',marginTop:'4px'}}>{k.sub}</div>
            </div>
          ))}
        </div>
      </div>

      {/* Collection status overview */}
      <div>
        <div style={{display:'flex',alignItems:'baseline',justifyContent:'space-between',marginBottom:'12px'}}>
          <div className="section-title">Collection Status</div>
          <div className="section-sub">{fmtDate(latestDate)}</div>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:'12px'}}>
          {collByStatus.map(s=>(
            <div key={s.key} className="kpi-card">
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'12px'}}>
                <CollStatusBadge status={s.key}/>
              </div>
              <div style={{fontSize:'36px',fontWeight:700,letterSpacing:'-.04em',lineHeight:1}}>{s.count}</div>
              <div style={{fontSize:'12px',color:'var(--muted)',marginTop:'4px'}}>entries</div>
            </div>
          ))}
        </div>
      </div>

      {/* In Transit */}
      <div>
        <div style={{display:'flex',alignItems:'baseline',justifyContent:'space-between',marginBottom:'12px'}}>
          <div>
            <div className="section-title">In Transit</div>
            <div className="section-sub">{transit.length} vehicle{transit.length!==1?'s':''} currently out</div>
          </div>
          <button onClick={goEntries} className="btn btn-ghost btn-sm">View all →</button>
        </div>
        {transit.length===0
          ? <EmptyState text="No vehicles in transit. All trips completed."/>
          : <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(300px,1fr))',gap:'12px'}}>
              {transit.map(e=><TransitCard key={e.id} entry={e} onEdit={()=>onEdit(e)}/>)}
            </div>
        }
      </div>

      {/* Two column: shifts + recent */}
      <div style={{display:'grid',gridTemplateColumns:'1fr 2fr',gap:'16px'}}>
        {/* Shift stats */}
        <div>
          <div className="section-title" style={{marginBottom:'12px'}}>By Shift</div>
          <div style={{display:'flex',flexDirection:'column',gap:'10px'}}>
            {shiftStats.map(s=>{
              const pct = s.total ? (s.done/s.total)*100 : 0;
              return (
                <div key={s.s} className="card" style={{padding:'16px'}}>
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'10px'}}>
                    <div style={{fontWeight:700,fontSize:'14px',display:'flex',alignItems:'center',gap:'6px'}}>
                      {s.s==='Day'?'☀️':'🌙'} {s.s} Shift
                    </div>
                    <div className="mono" style={{fontSize:'12px'}}>
                      <span style={{color:'var(--green-600)',fontWeight:700}}>{s.done}</span>
                      <span style={{color:'var(--hint)'}}> / {s.total}</span>
                    </div>
                  </div>
                  <div style={{height:'5px',background:'var(--surface-2)',borderRadius:'99px',overflow:'hidden'}}>
                    <div style={{height:'100%',background:'linear-gradient(90deg,#f59e0b,#d97706)',borderRadius:'99px',width:`${pct}%`,transition:'width .4s'}}></div>
                  </div>
                  <div style={{fontSize:'11px',color:'var(--hint)',marginTop:'6px'}}>{s.total?`${Math.round(pct)}% complete`:'No entries'}</div>
                </div>
              );
            })}
          </div>
        </div>

        {/* Recent activity */}
        <div>
          <div style={{display:'flex',alignItems:'baseline',justifyContent:'space-between',marginBottom:'12px'}}>
            <div className="section-title">Recent Activity</div>
          </div>
          <div className="card" style={{overflow:'hidden'}}>
            {day.slice(0,8).map((e,i)=>(
              <button key={e.id} onClick={()=>onEdit(e)}
                style={{width:'100%',textAlign:'left',padding:'12px 16px',display:'flex',alignItems:'center',gap:'12px',borderBottom: i<Math.min(day.length,8)-1 ? '1px solid var(--border)' : 'none',background:'transparent',cursor:'pointer',transition:'background .1s'}}
                onMouseEnter={ev=>ev.currentTarget.style.background='var(--amber-50)'}
                onMouseLeave={ev=>ev.currentTarget.style.background='transparent'}
              >
                <div style={{width:'36px',height:'36px',borderRadius:'var(--radius)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,background: e.tripStatus==='delivered' ? 'var(--green-100)' : 'var(--amber-100)'}}>
                  {e.tripStatus==='delivered'
                    ? <svg className="w-4 h-4" style={{color:'var(--green-700)'}} fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg>
                    : <svg className="w-4 h-4" style={{color:'var(--amber-700)'}} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M12 8v4l3 3"/><circle cx="12" cy="12" r="9"/></svg>}
                </div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{display:'flex',alignItems:'center',gap:'6px',flexWrap:'wrap',fontSize:'13.5px'}}>
                    <span style={{fontWeight:700}}>{e.vehicleNo}</span>
                    <span className="badge mono" style={{background:'var(--amber-100)',color:'var(--amber-800)',fontSize:'11px',padding:'1px 6px'}}>{e.branch}</span>
                    <CollStatusBadge status={e.collStatus} size="xs"/>
                    {e.keyCompany && <CompanyBadge keyCompany={e.keyCompany} subCompany="" zone="" size="xs"/>}
                  </div>
                  <div style={{fontSize:'12px',color:'var(--muted)',marginTop:'2px'}}>{e.fromLoc} → {e.toLoc} · {e.shift} · {e.driverName}</div>
                </div>
                <div className="desktop-only" style={{textAlign:'right',flexShrink:0}}>
                  <div className="mono" style={{fontSize:'12px',color:'var(--ink-2)'}}>{fmtTime(e.outTime)} → {fmtTime(e.inTime)}</div>
                  <div className="mono" style={{fontSize:'11px',color:'var(--hint)'}}>{fmtDur(e.outTime,e.inTime)}</div>
                </div>
              </button>
            ))}
            {day.length===0 && <div style={{padding:'32px',textAlign:'center',color:'var(--hint)',fontSize:'13px'}}>No entries today.</div>}
          </div>
        </div>
      </div>

      {/* Key Company Summary */}
      <div>
        <div style={{display:'flex',alignItems:'baseline',justifyContent:'space-between',marginBottom:'12px'}}>
          <div className="section-title">Key Company Summary</div>
          <div className="section-sub">All companies · {fmtDate(latestDate)}</div>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(180px,1fr))',gap:'12px'}}>
          {companyStats.map(cs=>{
            const p = cpal(cs.key);
            const pct = cs.total ? (cs.delivered/cs.total)*100 : 0;
            return (
              <div key={cs.key} className="card card-hover"
                style={{border:`1.5px solid ${p.border}`,overflow:'hidden'}}>
                <div style={{height:'3px',background:p.dot}}></div>
                <div style={{padding:'16px'}}>
                  <div style={{display:'inline-flex',alignItems:'center',gap:'5px',padding:'3px 9px',borderRadius:'99px',background:p.bg,color:p.text,fontSize:'11.5px',fontWeight:700,marginBottom:'12px'}}>
                    <span className="w-1.5 h-1.5 rounded-full" style={{background:p.dot,flexShrink:0}}></span>
                    {cs.key}
                  </div>
                  <div style={{fontSize:'38px',fontWeight:700,letterSpacing:'-.05em',lineHeight:1}}>{cs.total}</div>
                  <div style={{fontSize:'11px',color:'var(--muted)',marginTop:'2px'}}>total trips</div>
                  <div style={{display:'flex',justifyContent:'space-between',fontSize:'11.5px',marginTop:'10px'}}>
                    <span style={{color:'var(--green-700)',fontWeight:600}}>{cs.delivered} done</span>
                    {cs.transit>0 && <span style={{color:'var(--amber-700)',fontWeight:600}}>{cs.transit} out</span>}
                  </div>
                  <div style={{height:'4px',background:'var(--surface-2)',borderRadius:'99px',marginTop:'8px',overflow:'hidden'}}>
                    <div style={{height:'100%',background:p.dot,borderRadius:'99px',width:`${pct}%`,transition:'width .4s'}}></div>
                  </div>
                  {cs.zones.length>0 && (
                    <div style={{display:'flex',flexWrap:'wrap',gap:'4px',marginTop:'10px'}}>
                      {cs.zones.map(({z,n})=>{
                        const zs=ZONE_STYLES[z];
                        return <span key={z} className="badge" style={{background:zs?.bg,color:zs?.text,fontSize:'10px',padding:'1px 6px'}}>{z.replace('Zone ','Z')}{n>1?` ×${n}`:''}</span>;
                      })}
                    </div>
                  )}
                  {cs.total===0 && <div style={{fontSize:'11px',color:'var(--hint)',marginTop:'8px'}}>No trips today</div>}
                </div>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

function EmptyState({ text }) {
  return (
    <div style={{border:'2px dashed var(--border)',borderRadius:'var(--radius-lg)',padding:'40px',textAlign:'center',color:'var(--hint)',fontSize:'13px'}}>
      {text}
    </div>
  );
}

function TransitCard({ entry, onEdit }) {
  const [, tick] = useState(0);
  useEffect(()=>{ const i=setInterval(()=>tick(t=>t+1),30000); return ()=>clearInterval(i); },[]);
  const elapsed = entry.outTime ? fmtDur(entry.outTime, new Date().toISOString()) : '—';
  return (
    <div onClick={onEdit} className="card card-hover" style={{padding:'16px',cursor:'pointer'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:'10px'}}>
        <div>
          <div style={{display:'flex',alignItems:'center',gap:'6px',flexWrap:'wrap',marginBottom:'4px'}}>
            <span className="mono" style={{fontSize:'10.5px',color:'var(--hint)'}}>{entry.id}</span>
            <span className="badge mono" style={{background:'var(--amber-100)',color:'var(--amber-800)',fontSize:'10.5px',padding:'1px 5px'}}>{entry.branch}</span>
            <CollStatusBadge status={entry.collStatus} size="xs"/>
          </div>
          <div style={{fontWeight:700,fontSize:'16px',letterSpacing:'-.01em'}}>{entry.vehicleNo}</div>
          {entry.keyCompany && <div style={{marginTop:'4px'}}><CompanyBadge keyCompany={entry.keyCompany} subCompany={entry.subCompany} zone={entry.zone} size="xs"/></div>}
        </div>
        <TripStatusBadge status={entry.tripStatus}/>
      </div>
      <div style={{display:'flex',flexDirection:'column',gap:'4px',fontSize:'12.5px',color:'var(--ink-2)'}}>
        <div style={{display:'flex',alignItems:'center',gap:'6px'}}>
          <span className="w-1.5 h-1.5 rounded-full shrink-0" style={{background:'#22c55e'}}></span>
          <span style={{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{entry.fromLoc}</span>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:'6px'}}>
          <span className="w-1.5 h-1.5 rounded-full shrink-0" style={{background:'#ef4444'}}></span>
          <span style={{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{entry.toLoc}</span>
        </div>
      </div>
      <div style={{borderTop:'1px solid var(--border)',marginTop:'12px',paddingTop:'10px',display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:'8px',fontSize:'11.5px'}}>
        <div><div className="mono" style={{color:'var(--hint)',fontSize:'10px',marginBottom:'2px'}}>DRIVER</div><div style={{fontWeight:600,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{entry.driverName}</div></div>
        <div><div className="mono" style={{color:'var(--hint)',fontSize:'10px',marginBottom:'2px'}}>SHIFT</div><div style={{fontWeight:600}}>{entry.shift}</div></div>
        <div style={{textAlign:'right'}}><div className="mono" style={{color:'var(--hint)',fontSize:'10px',marginBottom:'2px'}}>ELAPSED</div><div className="mono" style={{fontWeight:700,color:'var(--amber-700)'}}>{elapsed}</div></div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════
   ENTRIES PAGE
═══════════════════════════════════════════════════════ */
function EntriesPage({ onNew, onEdit }) {
  const { entries } = useData();
  const [filters, setFilters] = useState({
    date:'all', collStatus:'all', tripStatus:'all', shift:'all', branch:'all', keyCompany:'all', zone:'all', search:''
  });
  const [page, setPage] = useState(1);
  const PER_PAGE = 25;

  const dates = useMemo(()=>[...new Set(entries.map(e=>e.date))].sort().reverse(),[entries]);

  const filtered = useMemo(()=>entries.filter(e=>{
    if (filters.date       !=='all' && e.date       !==filters.date)       return false;
    if (filters.collStatus !=='all' && e.collStatus !==filters.collStatus) return false;
    if (filters.tripStatus !=='all' && e.tripStatus !==filters.tripStatus) return false;
    if (filters.shift      !=='all' && e.shift      !==filters.shift)      return false;
    if (filters.branch     !=='all' && e.branch     !==filters.branch)     return false;
    if (filters.keyCompany !=='all' && e.keyCompany !==filters.keyCompany) return false;
    if (filters.zone       !=='all' && e.zone       !==filters.zone)       return false;
    if (filters.search) {
      const s=filters.search.toLowerCase();
      if (!`${e.id} ${e.vehicleNo} ${e.fromLoc} ${e.toLoc} ${e.driverName} ${e.driverMobile} ${e.incharge} ${e.branch} ${e.keyCompany} ${e.subCompany} ${e.zone}`.toLowerCase().includes(s)) return false;
    }
    return true;
  }),[entries,filters]);

  const totalPages = Math.ceil(filtered.length / PER_PAGE);
  const paged = filtered.slice((page-1)*PER_PAGE, page*PER_PAGE);

  useEffect(()=>setPage(1),[filters]);

  const setF = (key, val) => setFilters(f=>({...f,[key]:val}));

  const exportCSV = () => {
    const h=['ID','Date','Coll Status','Trip Status','Key Company','Sub Company','Zone','Vehicle','Branch','From','To','Shift','Incharge','Driver','Mobile','Out Time','In Time','Duration','Remarks'];
    const rows=filtered.map(e=>[e.id,e.date,e.collStatus,e.tripStatus,e.keyCompany,e.subCompany,e.zone,e.vehicleNo,e.branch,e.fromLoc,e.toLoc,e.shift,e.incharge,e.driverName,e.driverMobile,fmtTime(e.outTime),fmtTime(e.inTime),fmtDur(e.outTime,e.inTime),e.remarks]);
    const csv=[h,...rows].map(r=>r.map(c=>`"${String(c||'').replace(/"/g,'""')}"`).join(',')).join('\n');
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
    a.download=`uddhava-${todayStr()}.csv`;a.click();
  };

  const selStyle = {padding:'7px 10px',fontSize:'12.5px',borderRadius:'var(--radius-sm)',border:'1.5px solid var(--border)',background:'var(--surface)',color:'var(--ink)',flexShrink:0,minWidth:'110px'};

  return (
    <div style={{display:'flex',flexDirection:'column',gap:'16px'}}>
      {/* Header */}
      <div style={{display:'flex',flexWrap:'wrap',alignItems:'center',justifyContent:'space-between',gap:'12px'}}>
        <div>
          <h2 style={{fontWeight:700,fontSize:'20px',letterSpacing:'-.03em'}}>All Entries</h2>
          <p style={{fontSize:'12.5px',color:'var(--muted)',marginTop:'2px'}}>{filtered.length} of {entries.length} entries</p>
        </div>
        <div style={{display:'flex',gap:'8px'}}>
          <button onClick={exportCSV} className="btn btn-ghost btn-sm">
            <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2M7 10l5 5 5-5M12 15V3"/></svg>
            Export CSV
          </button>
          <button onClick={onNew} className="btn btn-primary btn-sm">
            <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path d="M12 4v16m8-8H4"/></svg>
            New Entry
          </button>
        </div>
      </div>

      {/* Filters */}
      <div className="card" style={{padding:'14px 16px'}}>
        <div style={{display:'flex',flexWrap:'wrap',gap:'8px',alignItems:'center'}}>
          <input value={filters.search} onChange={e=>setF('search',e.target.value)}
            placeholder="Search vehicle, driver, company, zone…"
            style={{flex:'1 1 200px',padding:'7px 12px',fontSize:'13px'}}/>
          <select value={filters.date} onChange={e=>setF('date',e.target.value)} style={selStyle}>
            <option value="all">All Dates</option>
            {dates.map(d=><option key={d} value={d}>{fmtDate(d)}</option>)}
          </select>
          <select value={filters.collStatus} onChange={e=>setF('collStatus',e.target.value)} style={selStyle}>
            <option value="all">All Coll. Status</option>
            {COLL_STATUSES.map(s=><option key={s.key} value={s.key}>{s.label}</option>)}
          </select>
          <select value={filters.tripStatus} onChange={e=>setF('tripStatus',e.target.value)} style={selStyle}>
            <option value="all">All Trip Status</option>
            {TRIP_STATUSES.map(s=><option key={s.key} value={s.key}>{s.label}</option>)}
          </select>
          <select value={filters.keyCompany} onChange={e=>setF('keyCompany',e.target.value)} style={selStyle}>
            <option value="all">All Companies</option>
            {KEY_COMPANY_NAMES.map(k=><option key={k} value={k}>{k}</option>)}
          </select>
          <select value={filters.zone} onChange={e=>setF('zone',e.target.value)} style={selStyle}>
            <option value="all">All Zones</option>
            {ZONES.map(z=><option key={z} value={z}>{z}</option>)}
          </select>
          <select value={filters.branch} onChange={e=>setF('branch',e.target.value)} style={selStyle}>
            <option value="all">All Branches</option>
            {BRANCHES.map(b=><option key={b} value={b}>{b}</option>)}
          </select>
          <select value={filters.shift} onChange={e=>setF('shift',e.target.value)} style={selStyle}>
            <option value="all">All Shifts</option>
            {SHIFTS.map(s=><option key={s} value={s}>{s}</option>)}
          </select>
          {Object.entries(filters).some(([k,v])=>v!=='all'&&v!=='') && (
            <button onClick={()=>setFilters({date:'all',collStatus:'all',tripStatus:'all',shift:'all',branch:'all',keyCompany:'all',zone:'all',search:''})}
              className="btn btn-ghost btn-sm" style={{color:'var(--red-600)',borderColor:'var(--red-100)'}}>
              Clear filters
            </button>
          )}
        </div>
      </div>

      {/* Table desktop */}
      <div className="card desktop-only" style={{overflow:'hidden'}}>
        <div style={{overflowX:'auto'}}>
          <table className="tbl">
            <thead>
              <tr>
                {['Entry ID','Coll. Status','Company / Zone','Vehicle','Branch','From → To','Shift / Incharge','Driver','Out → In','Duration','Trip Status',''].map(h=>(
                  <th key={h}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {paged.map(e=>(
                <tr key={e.id}>
                  <td>
                    <div className="mono" style={{fontSize:'11.5px',color:'var(--hint)'}}>{e.id}</div>
                    <div style={{fontSize:'11px',color:'var(--hint)',marginTop:'1px'}}>{fmtDate(e.date)}</div>
                  </td>
                  <td><CollStatusBadge status={e.collStatus} size="xs"/></td>
                  <td><CompanyBadge keyCompany={e.keyCompany} subCompany={e.subCompany} zone={e.zone} size="xs"/></td>
                  <td style={{fontWeight:700,fontSize:'14px',letterSpacing:'-.01em'}}>{e.vehicleNo}</td>
                  <td><span className="badge mono" style={{background:'var(--amber-100)',color:'var(--amber-800)',fontSize:'11px'}}>{e.branch}</span></td>
                  <td>
                    <div style={{fontSize:'12.5px'}}>{e.fromLoc}</div>
                    <div style={{fontSize:'11.5px',color:'var(--muted)',marginTop:'1px'}}>↓ {e.toLoc}</div>
                  </td>
                  <td>
                    <div style={{fontSize:'12.5px',fontWeight:600}}>{e.shift}</div>
                    <div style={{fontSize:'11.5px',color:'var(--muted)'}}>{e.incharge}</div>
                  </td>
                  <td>
                    <div style={{fontSize:'12.5px',fontWeight:600}}>{e.driverName}</div>
                    <div className="mono" style={{fontSize:'11px',color:'var(--muted)'}}>{e.driverMobile}</div>
                  </td>
                  <td className="mono" style={{fontSize:'11.5px'}}>
                    <div style={{color:'var(--green-700)'}}>{fmtTime(e.outTime)}</div>
                    <div style={{color:'var(--hint)'}}>{fmtTime(e.inTime)}</div>
                  </td>
                  <td className="mono" style={{fontSize:'12px',fontWeight:600}}>{fmtDur(e.outTime,e.inTime)}</td>
                  <td><TripStatusBadge status={e.tripStatus}/></td>
                  <td>
                    <button onClick={()=>onEdit(e)} className="btn btn-ghost btn-sm btn-icon" title="Edit">
                      <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                    </button>
                  </td>
                </tr>
              ))}
              {paged.length===0 && (
                <tr><td colSpan={12} style={{textAlign:'center',padding:'40px',color:'var(--hint)',fontSize:'13px'}}>No entries match your filters.</td></tr>
              )}
            </tbody>
          </table>
        </div>
        {totalPages>1 && (
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'12px 16px',borderTop:'1px solid var(--border)',fontSize:'12.5px',color:'var(--muted)'}}>
            <span>Showing {(page-1)*PER_PAGE+1}–{Math.min(page*PER_PAGE,filtered.length)} of {filtered.length}</span>
            <div style={{display:'flex',gap:'6px'}}>
              <button onClick={()=>setPage(p=>Math.max(1,p-1))} disabled={page===1} className="btn btn-ghost btn-sm">← Prev</button>
              {[...Array(Math.min(totalPages,7))].map((_,i)=>{
                const p=i+1;
                return <button key={p} onClick={()=>setPage(p)} className="btn btn-sm" style={{background: p===page ? 'var(--ink)' : 'transparent', color: p===page ? 'var(--amber-300)' : 'var(--muted)',border: p===page ? '1.5px solid var(--ink)' : '1.5px solid var(--border)'}}>{p}</button>;
              })}
              <button onClick={()=>setPage(p=>Math.min(totalPages,p+1))} disabled={page===totalPages} className="btn btn-ghost btn-sm">Next →</button>
            </div>
          </div>
        )}
      </div>

      {/* Mobile cards */}
      <div className="mobile-only" style={{display:'flex',flexDirection:'column',gap:'10px'}}>
        {paged.map(e=>(
          <button key={e.id} onClick={()=>onEdit(e)} style={{width:'100%',textAlign:'left',background:'var(--surface)',border:'1.5px solid var(--border)',borderRadius:'var(--radius-lg)',padding:'14px',cursor:'pointer'}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:'8px'}}>
              <div>
                <div style={{display:'flex',alignItems:'center',gap:'6px',flexWrap:'wrap'}}>
                  <span style={{fontWeight:700,fontSize:'15px'}}>{e.vehicleNo}</span>
                  <span className="badge mono" style={{background:'var(--amber-100)',color:'var(--amber-800)',fontSize:'10.5px'}}>{e.branch}</span>
                </div>
                <div style={{marginTop:'4px',display:'flex',gap:'4px',flexWrap:'wrap'}}>
                  <CollStatusBadge status={e.collStatus} size="xs"/>
                  <TripStatusBadge status={e.tripStatus}/>
                </div>
              </div>
            </div>
            {e.keyCompany && <div style={{marginBottom:'8px'}}><CompanyBadge keyCompany={e.keyCompany} subCompany={e.subCompany} zone={e.zone} size="xs"/></div>}
            <div style={{fontSize:'12.5px',color:'var(--ink-2)',display:'flex',flexDirection:'column',gap:'3px'}}>
              <div>📍 {e.fromLoc} → {e.toLoc}</div>
            </div>
            <div style={{borderTop:'1px solid var(--border)',marginTop:'10px',paddingTop:'8px',display:'flex',justifyContent:'space-between',fontSize:'12px',color:'var(--muted)'}}>
              <span>{e.driverName} · {e.shift}</span>
              <span className="mono" style={{fontWeight:600}}>{fmtDur(e.outTime,e.inTime)}</span>
            </div>
          </button>
        ))}
        {paged.length===0 && <EmptyState text="No entries match your filters."/>}
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════
   ENTRY MODAL
═══════════════════════════════════════════════════════ */
function EntryModal({ entry, onClose }) {
  const isEdit = !!entry;
  const [tab, setTab] = useState('single');

  // Close on escape
  useEffect(()=>{
    const h=e=>{ if(e.key==='Escape') onClose(); };
    document.addEventListener('keydown',h);
    return ()=>document.removeEventListener('keydown',h);
  },[onClose]);

  return (
    <div className="anim-fade"
      style={{position:'fixed',inset:0,background:'rgba(0,0,0,.55)',backdropFilter:'blur(4px)',zIndex:50,display:'flex',alignItems:'flex-end',justifyContent:'center',padding:'0'}}
      onClick={e=>{ if(e.target===e.currentTarget) onClose(); }}>
      <div className="anim-fade-up"
        style={{background:'var(--surface)',width:'100%',maxWidth:'640px',maxHeight:'96vh',display:'flex',flexDirection:'column',borderRadius:'var(--radius-xl) var(--radius-xl) 0 0',boxShadow:'var(--shadow-lg)',overflow:'hidden'}}>
        {/* Modal header */}
        <div style={{padding:'20px 24px 0',flexShrink:0}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'16px'}}>
            <div>
              <div className="mono" style={{fontSize:'10px',color:'var(--hint)',letterSpacing:'.08em',marginBottom:'2px'}}>{isEdit?'EDIT ENTRY':'NEW ENTRY'}</div>
              <h2 style={{fontWeight:700,fontSize:'18px',letterSpacing:'-.02em'}}>{isEdit?entry.id:'Log a Trip'}</h2>
            </div>
            <button onClick={onClose} className="btn btn-ghost btn-icon">
              <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
          </div>
          {!isEdit && (
            <div style={{display:'flex',gap:'2px',borderBottom:'2px solid var(--border)',marginBottom:'-1px'}}>
              {[{key:'single',label:'✏ Single Entry'},{key:'bulk',label:'📊 Bulk Upload'}].map(t=>(
                <button key={t.key} onClick={()=>setTab(t.key)}
                  className={`tab ${tab===t.key?'active':''}`} style={{fontSize:'13px',padding:'8px 14px'}}>
                  {t.label}
                </button>
              ))}
            </div>
          )}
        </div>

        {tab==='single' ? <SingleEntryForm entry={entry} onClose={onClose} isEdit={isEdit}/> : <BulkUploadForm onClose={onClose}/>}
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════
   SINGLE ENTRY FORM
═══════════════════════════════════════════════════════ */
function SingleEntryForm({ entry, onClose, isEdit }) {
  const { addEntry, updateEntry, deleteEntry } = useData();
  const BLANK = {
    type:'collection', date:todayStr(), collStatus:'created',
    keyCompany:'', subCompany:'', zone:'',
    vehicleNo:'', fromLoc:'', toLoc:'',
    branch:'', shift:'Day', incharge:'',
    driverName:'', driverMobile:'',
    outTime:'', inTime:'', tripStatus:'transit', remarks:''
  };

  const [form, setForm]   = useState(entry ? {...entry} : BLANK);
  const [errors, setErr]  = useState({});
  const [saving, setSave] = useState(false);
  const [delConf, setDel] = useState(false);

  const set = (k,v) => setForm(f=>({...f,[k]:v}));
  const setNow = (field) => set(field, nowInput());

  const handleCompany = ({keyCompany, subCompany, zone}) => setForm(f=>({...f,keyCompany,subCompany,zone}));

  const validate = () => {
    const e = {};
    if (!form.keyCompany)           e.keyCompany='Required';
    if (!form.subCompany)           e.subCompany='Required';
    if (!form.zone)                 e.zone='Required';
    if (!form.vehicleNo.trim())     e.vehicleNo='Required';
    if (!form.branch)               e.branch='Required';
    if (!form.fromLoc.trim())       e.fromLoc='Required';
    if (!form.toLoc.trim())         e.toLoc='Required';
    if (!form.incharge)             e.incharge='Required';
    if (!form.driverName.trim())    e.driverName='Required';
    if (!form.driverMobile.trim())  e.driverMobile='Required';
    if (!form.outTime)              e.outTime='Required';
    if (form.tripStatus==='delivered'&&!form.inTime) e.inTime='Required for delivered';
    if (form.inTime&&form.outTime&&new Date(form.inTime)<new Date(form.outTime)) e.inTime='Must be after out time';
    setErr(e);
    return Object.keys(e).length===0;
  };

  const save = async () => {
    if (!validate()) return;
    setSave(true);
    try {
      if (isEdit) await updateEntry(entry.id, {...form, id:entry.id, createdAt:entry.createdAt});
      else        await addEntry({...form, id:genId(), createdAt:new Date().toISOString()});
      onClose();
    } catch(err) { alert('Save failed: '+err.message); setSave(false); }
  };

  const remove = async () => {
    setSave(true);
    try { await deleteEntry(entry.id); onClose(); }
    catch(err) { alert('Delete failed: '+err.message); setSave(false); setDel(false); }
  };

  const markDelivered = () => setForm(f=>({...f,tripStatus:'delivered',inTime:f.inTime||nowInput()}));

  const secStyle = {background:'var(--surface-2)',borderRadius:'var(--radius-lg)',padding:'16px',marginBottom:'0'};
  const rowStyle = {display:'grid',gap:'12px',gridTemplateColumns:'1fr 1fr'};
  const monoLabel = {fontSize:'9.5px',fontWeight:700,color:'var(--hint)',letterSpacing:'.1em',marginBottom:'10px'};

  return (
    <>
      <div style={{flex:1,overflowY:'auto',padding:'20px 24px',display:'flex',flexDirection:'column',gap:'16px'}}>

        {/* Section: Company / Zone */}
        <div style={secStyle}>
          <div style={monoLabel}>COMPANY & ZONE</div>
          <CompanySelector keyCompany={form.keyCompany} subCompany={form.subCompany} zone={form.zone}
            onChange={handleCompany} errors={{keyCompany:errors.keyCompany,subCompany:errors.subCompany,zone:errors.zone}}/>
        </div>

        {/* Section: Collection Status */}
        <div style={secStyle}>
          <div style={monoLabel}>COLLECTION STATUS</div>
          <CollStatusSelector value={form.collStatus} onChange={v=>set('collStatus',v)}/>
        </div>

        {/* Section: Trip details */}
        <div style={secStyle}>
          <div style={monoLabel}>TRIP DETAILS</div>
          <div style={{display:'flex',flexDirection:'column',gap:'12px'}}>
            <div style={rowStyle}>
              <Field label="Vehicle Number" error={errors.vehicleNo} required>
                <input value={form.vehicleNo} onChange={e=>set('vehicleNo',e.target.value.toUpperCase())} placeholder="TN-09-AB-1234" className="mono"/>
              </Field>
              <Field label="Date" required>
                <input type="date" value={form.date} onChange={e=>set('date',e.target.value)}/>
              </Field>
            </div>

            <div style={rowStyle}>
              <Field label="From Location" error={errors.fromLoc} required hint="Pickup point">
                <input value={form.fromLoc} onChange={e=>set('fromLoc',e.target.value)} placeholder="Vendor / company name"/>
              </Field>
              <Field label="To Location" error={errors.toLoc} required hint="Drop point">
                <input value={form.toLoc} onChange={e=>set('toLoc',e.target.value)} placeholder="Destination hub / branch"/>
              </Field>
            </div>

            <Field label="Branch" error={errors.branch} required>
              <SearchableSelect options={BRANCHES} value={form.branch} onChange={v=>set('branch',v)} placeholder="Select branch"/>
            </Field>
          </div>
        </div>

        {/* Section: Shift & Incharge */}
        <div style={secStyle}>
          <div style={monoLabel}>SHIFT & INCHARGE</div>
          <div style={{display:'flex',flexDirection:'column',gap:'12px'}}>
            <div>
              <label className="text-xs font-semibold mb-2 block" style={{color:'var(--ink-2)'}}>Shift</label>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'8px'}}>
                {SHIFTS.map(s=>(
                  <button key={s} type="button" onClick={()=>set('shift',s)}
                    className="btn"
                    style={{
                      justifyContent:'center',gap:'6px',padding:'9px',
                      background: form.shift===s ? 'var(--ink)' : 'var(--surface)',
                      border: `1.5px solid ${form.shift===s ? 'var(--ink)' : 'var(--border)'}`,
                      color: form.shift===s ? 'var(--amber-300)' : 'var(--muted)',
                    }}>
                    {s==='Day'?'☀️':'🌙'} {s}
                  </button>
                ))}
              </div>
            </div>
            <Field label="Shift Incharge" error={errors.incharge} required>
              <SearchableSelect options={INCHARGES} value={form.incharge} onChange={v=>set('incharge',v)} placeholder="Select incharge"/>
            </Field>
          </div>
        </div>

        {/* Section: Driver */}
        <div style={secStyle}>
          <div style={monoLabel}>DRIVER INFO</div>
          <div style={rowStyle}>
            <Field label="Driver Name" error={errors.driverName} required>
              <input value={form.driverName} onChange={e=>set('driverName',e.target.value)} placeholder="Full name"/>
            </Field>
            <Field label="Mobile Number" error={errors.driverMobile} required>
              <input type="tel" value={form.driverMobile} onChange={e=>set('driverMobile',e.target.value)} placeholder="+91-XXXXX-XXXXX" className="mono"/>
            </Field>
          </div>
        </div>

        {/* Section: Timing */}
        <div style={secStyle}>
          <div style={monoLabel}>TIMING</div>
          <div style={{display:'flex',flexDirection:'column',gap:'12px'}}>
            <div style={rowStyle}>
              <Field label="Out Time" error={errors.outTime} required>
                <div style={{display:'flex',gap:'6px'}}>
                  <input type="datetime-local" value={form.outTime} onChange={e=>set('outTime',e.target.value)} style={{flex:1}}/>
                  <button type="button" onClick={()=>setNow('outTime')} className="btn btn-ghost btn-sm" style={{flexShrink:0,fontWeight:700,fontSize:'11px'}}>NOW</button>
                </div>
              </Field>
              <Field label="In Time" error={errors.inTime}>
                <div style={{display:'flex',gap:'6px'}}>
                  <input type="datetime-local" value={form.inTime} onChange={e=>set('inTime',e.target.value)} style={{flex:1}}/>
                  <button type="button" onClick={()=>setNow('inTime')} className="btn btn-ghost btn-sm" style={{flexShrink:0,fontWeight:700,fontSize:'11px'}}>NOW</button>
                </div>
              </Field>
            </div>
            {form.outTime && form.inTime && (
              <div style={{background:'var(--amber-50)',border:'1.5px solid var(--amber-200)',borderRadius:'var(--radius)',padding:'10px 14px',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                <span style={{fontSize:'12.5px',color:'var(--amber-700)',fontWeight:600}}>⏱ Turnaround time</span>
                <span className="mono" style={{fontWeight:700,color:'var(--amber-900)',fontSize:'14px'}}>{fmtDur(form.outTime,form.inTime)}</span>
              </div>
            )}
          </div>
        </div>

        {/* Section: Trip status */}
        <div style={secStyle}>
          <div style={monoLabel}>TRIP STATUS</div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'8px'}}>
            <button type="button" onClick={()=>set('tripStatus','transit')}
              style={{padding:'12px',borderRadius:'var(--radius)',border:`1.5px solid ${form.tripStatus==='transit'?'var(--amber-400)':'var(--border)'}`,background: form.tripStatus==='transit' ? 'var(--amber-50)' : 'var(--surface)',cursor:'pointer',textAlign:'left',transition:'all .15s',boxShadow: form.tripStatus==='transit' ? '0 0 0 2px var(--amber-200)' : 'none'}}>
              <div style={{fontWeight:700,fontSize:'13px',display:'flex',alignItems:'center',gap:'6px',color: form.tripStatus==='transit' ? 'var(--amber-800)' : 'var(--ink-2)'}}>
                <span className="w-2 h-2 rounded-full" style={{background:'#f59e0b',flexShrink:0}}></span>In Transit
              </div>
              <div style={{fontSize:'11.5px',color:'var(--muted)',marginTop:'3px'}}>Vehicle on route</div>
            </button>
            <button type="button" onClick={markDelivered}
              style={{padding:'12px',borderRadius:'var(--radius)',border:`1.5px solid ${form.tripStatus==='delivered'?'var(--green-500)':'var(--border)'}`,background: form.tripStatus==='delivered' ? 'var(--green-50)' : 'var(--surface)',cursor:'pointer',textAlign:'left',transition:'all .15s',boxShadow: form.tripStatus==='delivered' ? '0 0 0 2px var(--green-100)' : 'none'}}>
              <div style={{fontWeight:700,fontSize:'13px',display:'flex',alignItems:'center',gap:'6px',color: form.tripStatus==='delivered' ? 'var(--green-700)' : 'var(--ink-2)'}}>
                <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24" style={{flexShrink:0}}><path d="M5 13l4 4L19 7"/></svg>
                Delivered
              </div>
              <div style={{fontSize:'11.5px',color:'var(--muted)',marginTop:'3px'}}>Trip completed</div>
            </button>
          </div>
        </div>

        {/* Remarks */}
        <div style={secStyle}>
          <div style={monoLabel}>REMARKS</div>
          <textarea value={form.remarks} onChange={e=>set('remarks',e.target.value)} rows={2} placeholder="Optional notes…" style={{resize:'none'}}/>
        </div>
      </div>

      {/* Footer */}
      <div style={{padding:'14px 24px',borderTop:'1.5px solid var(--border)',background:'var(--surface-2)',display:'flex',gap:'8px',alignItems:'center',flexShrink:0}}>
        {isEdit && !delConf && (
          <button onClick={()=>setDel(true)} className="btn btn-danger btn-sm">Delete</button>
        )}
        {isEdit && delConf && (
          <>
            <span style={{fontSize:'12.5px',color:'var(--red-700)',fontWeight:600}}>Are you sure?</span>
            <button onClick={remove} disabled={saving} className="btn btn-sm" style={{background:'var(--red-600)',color:'white',border:'none'}}>Yes, delete</button>
            <button onClick={()=>setDel(false)} className="btn btn-ghost btn-sm">Cancel</button>
          </>
        )}
        <div style={{flex:1}}></div>
        <button onClick={onClose} className="btn btn-ghost btn-sm">Cancel</button>
        <button onClick={save} disabled={saving} className="btn btn-primary btn-sm">
          {saving ? <span className="loader spin"></span> : null}
          {isEdit ? 'Save Changes' : 'Log Entry'}
        </button>
      </div>
    </>
  );
}

/* ═══════════════════════════════════════════════════════
   BULK UPLOAD
═══════════════════════════════════════════════════════ */
function BulkUploadForm({ onClose }) {
  const { addEntries } = useData();
  const [rows, setRows]         = useState([]);
  const [errs, setErrs]         = useState([]);
  const [uploading, setUpl]     = useState(false);
  const [dragOver, setDrag]     = useState(false);
  const fileRef = useRef(null);

  const COL_MAP = {
    date:['date','Date','DATE'],collStatus:['coll status','collection status','Coll Status','Collection Status'],
    keyCompany:['key company','key_company','Key Company'],subCompany:['sub company','sub_company','Sub Company'],
    zone:['zone','Zone'],vehicleNo:['vehicle no','vehicle_no','Vehicle No','Vehicle'],
    branch:['branch','Branch'],fromLoc:['from','from company','from location','From','From Company'],
    toLoc:['to','to branch','to location','To','To Branch'],shift:['shift','Shift'],
    incharge:['incharge','Incharge'],driverName:['driver name','driver_name','Driver Name','Driver'],
    driverMobile:['mobile','mobile number','Mobile','Mobile Number'],
    outTime:['out time','out_time','Out Time'],inTime:['in time','in_time','In Time'],
    tripStatus:['trip status','trip_status','status','Status'],remarks:['remarks','Remarks','Notes'],
  };
  const resolveCol = raw => { const l=raw.toLowerCase().trim(); for(const [f,a] of Object.entries(COL_MAP)) { if(a.some(x=>x.toLowerCase()===l)) return f; } return null; };

  const parseFile = file => {
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const wb = XLSX.read(ev.target.result,{type:'binary',cellDates:true});
        const ws = wb.Sheets[wb.SheetNames[0]];
        const raw = XLSX.utils.sheet_to_json(ws,{defval:''});
        if (!raw.length) { alert('Sheet is empty.'); return; }

        const hmap = {};
        for (const k of Object.keys(raw[0])) { const f=resolveCol(k); if(f) hmap[f]=k; }

        const parsed=[], errList=[];
        raw.forEach((row, idx) => {
          const get = f => { const k=hmap[f]; return k ? String(row[k]||'').trim() : ''; };
          let date = get('date');
          if (!date && hmap['date'] && row[hmap['date']] instanceof Date) date=row[hmap['date']].toISOString().slice(0,10);
          if (date && date.includes('/')) { const [d,m,y]=date.split('/'); if(y) date=`${y}-${m.padStart(2,'0')}-${d.padStart(2,'0')}`; }

          const rowErrs=[];
          if (!date)               rowErrs.push('date missing');
          if (!get('vehicleNo'))   rowErrs.push('vehicle no missing');
          if (!get('fromLoc'))     rowErrs.push('from location missing');
          if (!get('toLoc'))       rowErrs.push('to location missing');

          const kc=get('keyCompany');
          if (kc && !KEY_COMPANY_NAMES.includes(kc)) rowErrs.push(`unknown key company "${kc}"`);
          const cs=get('collStatus')||'created';
          if (!COLL_STATUSES.find(s=>s.key===cs)) rowErrs.push(`invalid coll status "${cs}"`);

          const parseTime = (t, ref) => {
            if (!t||t==='—') return null;
            if (t instanceof Date) return t.toISOString();
            const st=String(t).trim(); if(!st) return null;
            try { const d=new Date(`${ref||date}T${st.length<=5?st+':00':st}`); if(!isNaN(d)) return d.toISOString(); } catch(_){}
            return null;
          };

          if (rowErrs.length) errList.push({row:idx+2,msgs:rowErrs});
          parsed.push({
            id:genId(), date, type:'collection',
            collStatus: cs, keyCompany:kc, subCompany:get('subCompany'), zone:get('zone'),
            vehicleNo:get('vehicleNo').toUpperCase(), branch:get('branch'),
            fromLoc:get('fromLoc'), toLoc:get('toLoc'),
            shift:get('shift')||'Day', incharge:get('incharge'),
            driverName:get('driverName'), driverMobile:get('driverMobile'),
            outTime:parseTime(get('outTime'),date), inTime:parseTime(get('inTime'),date),
            tripStatus:(get('tripStatus')||'transit').toLowerCase().includes('deliver')?'delivered':'transit',
            remarks:get('remarks'), createdAt:new Date().toISOString(), _err:rowErrs,
          });
        });
        setRows(parsed); setErrs(errList);
      } catch(e) { alert('Could not read file: '+e.message); }
    };
    reader.readAsBinaryString(file);
  };

  const handleFile = f => { if(!f) return; if(!f.name.match(/\.(xlsx|xls|csv)$/i)) { alert('Please upload .xlsx, .xls, or .csv'); return; } parseFile(f); };

  const upload = async () => {
    const valid = rows.filter(r=>r._err.length===0);
    if (!valid.length) { alert('No valid rows.'); return; }
    setUpl(true);
    try { await addEntries(valid.map(({_err,...r})=>r)); onClose(); }
    catch(e) { alert('Upload failed: '+e.message); setUpl(false); }
  };

  const downloadTemplate = () => {
    const headers = ['Date','Coll Status','Key Company','Sub Company','Zone','Vehicle No','Branch','From Location','To Location','Shift','Incharge','Driver Name','Mobile Number','Out Time','In Time','Trip Status','Remarks'];
    const s1 = ['2026-05-15','created','SDF','SDF Plant A','Zone 1','TN-09-AB-1234','TVK','Sundaram Textiles','TVK Hub','Day','Vinoth','Suresh Kumar','+91-98400-11111','07:30','09:45','delivered',''];
    const s2 = ['2026-05-15','hold','CAPARO','CAPARO Unit A','Zone 2','TN-09-CD-5678','RNT','CAPARO Chennai','RNT Hub','Night','Mani','Raj Pillai','+91-98400-22222','20:00','','transit','On hold - client request'];
    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.aoa_to_sheet([headers,s1,s2]);
    ws['!cols'] = Array(headers.length).fill({wch:20});
    XLSX.utils.book_append_sheet(wb,'Entries',ws);
    const instr = [['Column','Field','Required','Notes'],['A','Date','Yes','YYYY-MM-DD'],['B','Coll Status','No','created / hold / cancel / completed'],['C','Key Company','Yes',KEY_COMPANY_NAMES.join(', ')],['D','Sub Company','Yes','Match the key company'],['E','Zone','Yes','Zone 1, Zone 2, Zone 3, Zone 4'],['F','Vehicle No','Yes','e.g. TN-09-AB-1234'],['G','Branch','No',BRANCHES.join(', ')],['H','From Location','Yes','Pickup point'],['I','To Location','Yes','Drop point'],['J','Shift','No','Day / Night'],['K','Incharge','No',''],['L','Driver Name','No',''],['M','Mobile Number','No',''],['N','Out Time','No','HH:MM'],['O','In Time','No','HH:MM'],['P','Trip Status','No','transit / delivered'],['Q','Remarks','No','']];
    const wi = XLSX.utils.aoa_to_sheet(instr);
    wi['!cols'] = [{wch:10},{wch:18},{wch:10},{wch:50}];
    XLSX.utils.book_append_sheet(wb,'Instructions',wi);
    XLSX.writeFile(wb,'uddhava-template.xlsx');
  };

  return (
    <>
      <div style={{flex:1,overflowY:'auto',padding:'20px 24px',display:'flex',flexDirection:'column',gap:'16px'}}>
        <div style={{background:'var(--blue-50)',border:'1.5px solid var(--blue-100)',borderRadius:'var(--radius-lg)',padding:'16px'}}>
          <div style={{fontWeight:700,fontSize:'14px',color:'var(--blue-800)',marginBottom:'6px'}}>📊 Bulk Upload via Excel / CSV</div>
          <p style={{fontSize:'12.5px',color:'var(--blue-700)',marginBottom:'10px'}}>
            Required columns: Date, Key Company, Sub Company, Zone, Vehicle No, From Location, To Location.
          </p>
          <div style={{fontSize:'11.5px',color:'var(--blue-700)',marginBottom:'10px'}}>
            <strong>Coll Status:</strong> created · hold · cancel · completed<br/>
            <strong>Key Companies:</strong> {KEY_COMPANY_NAMES.join(', ')}<br/>
            <strong>Zones:</strong> Zone 1 · Zone 2 · Zone 3 · Zone 4
          </div>
          <button onClick={downloadTemplate} className="btn btn-sm" style={{background:'var(--blue-600)',color:'white',border:'none'}}>
            ↓ Download Template
          </button>
        </div>

        {rows.length===0 ? (
          <div className={`drop-zone ${dragOver?'drag-over':''}`}
            style={{padding:'48px',textAlign:'center'}}
            onDragOver={e=>{e.preventDefault();setDrag(true)}}
            onDragLeave={()=>setDrag(false)}
            onDrop={e=>{e.preventDefault();setDrag(false);handleFile(e.dataTransfer.files[0])}}
            onClick={()=>fileRef.current?.click()}>
            <div style={{fontSize:'40px',marginBottom:'12px'}}>📂</div>
            <div style={{fontWeight:700,fontSize:'14px',color:'var(--ink-2)',marginBottom:'4px'}}>Drop your Excel or CSV here</div>
            <div style={{fontSize:'12.5px',color:'var(--hint)'}}>or click to browse · .xlsx · .xls · .csv</div>
            <input ref={fileRef} type="file" accept=".xlsx,.xls,.csv" style={{display:'none'}} onChange={e=>handleFile(e.target.files[0])}/>
          </div>
        ) : (
          <div style={{display:'flex',flexDirection:'column',gap:'12px'}}>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
              <div>
                <div style={{fontWeight:700}}>{rows.length} rows parsed</div>
                <div style={{fontSize:'12.5px',color:'var(--muted)',marginTop:'2px'}}>
                  <span style={{color:'var(--green-700)',fontWeight:600}}>{rows.filter(r=>r._err.length===0).length} valid</span>
                  {errs.length>0 && <span style={{color:'var(--red-700)',fontWeight:600,marginLeft:'8px'}}>{errs.length} with errors</span>}
                </div>
              </div>
              <button onClick={()=>{setRows([]);setErrs([])}} className="btn btn-ghost btn-sm">✕ Clear</button>
            </div>
            {errs.length>0 && (
              <div style={{background:'var(--red-50)',border:'1.5px solid var(--red-100)',borderRadius:'var(--radius)',padding:'12px',maxHeight:'120px',overflowY:'auto'}}>
                {errs.map((e,i)=>(
                  <div key={i} style={{fontSize:'12px',color:'var(--red-700)',marginBottom:'2px'}}>
                    <span className="mono" style={{fontWeight:600}}>Row {e.row}:</span> {e.msgs.join(', ')}
                  </div>
                ))}
              </div>
            )}
            <div className="card" style={{overflow:'hidden',maxHeight:'280px',overflowY:'auto'}}>
              <table className="tbl">
                <thead>
                  <tr>{['#','Date','Coll Status','Key Co.','Sub Co.','Zone','Vehicle','Branch','Trip Status',''].map(h=><th key={h}>{h}</th>)}</tr>
                </thead>
                <tbody>
                  {rows.map((r,i)=>(
                    <tr key={i} style={{background: r._err.length ? 'var(--red-50)' : 'transparent'}}>
                      <td className="mono" style={{color:'var(--hint)',fontSize:'11px'}}>{i+2}</td>
                      <td>{r.date}</td>
                      <td><CollStatusBadge status={r.collStatus} size="xs"/></td>
                      <td style={{fontWeight:700}}>{r.keyCompany||'—'}</td>
                      <td style={{color:'var(--muted)',maxWidth:'80px',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{r.subCompany||'—'}</td>
                      <td>{r.zone ? <ZonePill zone={r.zone}/> : '—'}</td>
                      <td className="mono" style={{fontWeight:700}}>{r.vehicleNo}</td>
                      <td><span className="badge mono" style={{background:'var(--amber-100)',color:'var(--amber-800)',fontSize:'10px'}}>{r.branch||'—'}</span></td>
                      <td><TripStatusBadge status={r.tripStatus}/></td>
                      <td>{r._err.length ? <span title={r._err.join(', ')} style={{color:'var(--red-600)',cursor:'help'}}>⚠</span> : <span style={{color:'var(--green-600)'}}>✓</span>}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        )}
      </div>

      <div style={{padding:'14px 24px',borderTop:'1.5px solid var(--border)',background:'var(--surface-2)',display:'flex',gap:'8px',flexShrink:0}}>
        <div style={{flex:1}}></div>
        <button onClick={onClose} className="btn btn-ghost btn-sm">Cancel</button>
        {rows.length>0 && (
          <button onClick={upload} disabled={uploading||rows.filter(r=>r._err.length===0).length===0} className="btn btn-primary btn-sm">
            {uploading ? <span className="loader spin"></span> : null}
            Upload {rows.filter(r=>r._err.length===0).length} Entries
          </button>
        )}
      </div>
    </>
  );
}

/* ═══════════════════════════════════════════════════════
   BAR CHART
═══════════════════════════════════════════════════════ */
function BarChart({ data }) {
  const [hov, setHov] = useState(null);
  const CH=200,PL=32,PR=12,PT=20,PB=32;
  const chartH=CH-PT-PB;
  const maxV=Math.max(...data.map(d=>d.total),1);
  const gridMax=Math.ceil(maxV/5)*5||5;
  const svgW=Math.max(400,data.length*72+PL+PR);
  const yGrids=5;
  const yLabels=Array.from({length:yGrids+1},(_,i)=>Math.round((yGrids-i)*gridMax/yGrids));

  return (
    <div style={{overflowX:'auto'}}>
      <svg viewBox={`0 0 ${svgW} ${CH}`} style={{width:`${svgW}px`,height:`${CH}px`,display:'block'}}>
        {yLabels.map((v,i)=>{
          const y=PT+(i/yGrids)*chartH;
          return <g key={v}>
            <line x1={PL} x2={svgW-PR} y1={y} y2={y} stroke="var(--border)" strokeWidth="1" strokeDasharray={i===yGrids?'0':'3 3'}/>
            <text x={PL-4} y={y+4} textAnchor="end" fontSize="9" fill="var(--hint)" fontFamily="DM Mono,monospace">{v}</text>
          </g>;
        })}
        {data.map((d,idx)=>{
          const sw=(svgW-PL-PR)/data.length;
          const bw=(sw*0.6)/3-1;
          const x0=PL+idx*sw+sw*0.2;
          const yB=PT+chartH;
          const tH=chartH*(d.total/gridMax);
          const dH=chartH*(d.delivered/gridMax);
          const trH=chartH*(d.transit/gridMax);
          const lbl=new Date(d.date).toLocaleDateString('en-IN',{day:'2-digit',month:'short'});
          const isH=hov===idx;
          return (
            <g key={d.date} onMouseEnter={()=>setHov(idx)} onMouseLeave={()=>setHov(null)} style={{cursor:'pointer'}}>
              {isH && <rect x={PL+idx*sw} y={PT} width={sw} height={chartH} fill="var(--amber-50)" rx="4"/>}
              <rect x={x0} y={yB-tH} width={bw} height={Math.max(tH,2)} rx="2" fill={isH?'#d97706':'#f59e0b'}/>
              {d.total>0 && <text x={x0+bw/2} y={yB-tH-5} textAnchor="middle" fontSize="9" fontWeight="700" fill="var(--amber-800)" fontFamily="DM Mono,monospace">{d.total}</text>}
              <rect x={x0+bw+1} y={yB-dH} width={bw} height={Math.max(dH,2)} rx="2" fill={isH?'#15803d':'#22c55e'}/>
              {d.delivered>0 && <text x={x0+bw*1.5+1} y={yB-dH-5} textAnchor="middle" fontSize="9" fontWeight="700" fill="#14532d" fontFamily="DM Mono,monospace">{d.delivered}</text>}
              <rect x={x0+bw*2+2} y={yB-trH} width={bw} height={Math.max(trH,2)} rx="2" fill={isH?'#92400e':'#fbbf24'} opacity=".7"/>
              <text x={x0+bw*1.5} y={yB+16} textAnchor="middle" fontSize="9" fill="var(--muted)" fontFamily="DM Mono,monospace">{lbl}</text>
              {isH && (
                <g>
                  <rect x={Math.min(x0,svgW-130)} y={PT} width="120" height="62" rx="6" fill="var(--ink)" opacity=".95"/>
                  <text x={Math.min(x0,svgW-130)+8} y={PT+15} fontSize="10" fontWeight="700" fill="#fbbf24" fontFamily="DM Mono,monospace">{lbl}</text>
                  <text x={Math.min(x0,svgW-130)+8} y={PT+30} fontSize="9" fill="#e2e8f0" fontFamily="DM Mono,monospace">Total: {d.total}</text>
                  <text x={Math.min(x0,svgW-130)+8} y={PT+44} fontSize="9" fill="#86efac" fontFamily="DM Mono,monospace">Delivered: {d.delivered}</text>
                  <text x={Math.min(x0,svgW-130)+8} y={PT+58} fontSize="9" fill="#fcd34d" fontFamily="DM Mono,monospace">Transit: {d.transit}</text>
                </g>
              )}
            </g>
          );
        })}
        <line x1={PL} x2={PL} y1={PT} y2={PT+chartH} stroke="var(--border-2)" strokeWidth="1"/>
        <line x1={PL} x2={svgW-PR} y1={PT+chartH} y2={PT+chartH} stroke="var(--border-2)" strokeWidth="1"/>
      </svg>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════
   REPORTS
═══════════════════════════════════════════════════════ */
function ReportsPage() {
  const { entries } = useData();

  const byDate = useMemo(()=>{
    const m={};
    entries.forEach(e=>{
      if(!m[e.date]) m[e.date]={date:e.date,total:0,delivered:0,transit:0};
      m[e.date].total++;
      if(e.tripStatus==='delivered') m[e.date].delivered++; else m[e.date].transit++;
    });
    return Object.values(m).sort((a,b)=>a.date.localeCompare(b.date));
  },[entries]);

  const collStatusStats = useMemo(()=>COLL_STATUSES.map(s=>({
    ...s, count: entries.filter(e=>e.collStatus===s.key).length
  })),[entries]);

  const byCompany = useMemo(()=>KEY_COMPANY_NAMES.map(k=>{
    const ke=entries.filter(e=>e.keyCompany===k);
    return {
      key:k, total:ke.length,
      delivered:ke.filter(e=>e.tripStatus==='delivered').length,
      zones:ZONES.map(z=>({z,n:ke.filter(e=>e.zone===z).length})).filter(x=>x.n>0),
      subs:KEY_COMPANIES[k].subs.map(s=>({s,n:ke.filter(e=>e.subCompany===s).length})).filter(x=>x.n>0),
      collStatus:COLL_STATUSES.map(s=>({s:s.key,n:ke.filter(e=>e.collStatus===s.key).length})).filter(x=>x.n>0),
    };
  }).filter(x=>x.total>0),[entries]);

  const byDriver = useMemo(()=>{
    const m={};
    entries.forEach(e=>{
      if(!m[e.driverName]) m[e.driverName]={name:e.driverName,mobile:e.driverMobile,total:0,delivered:0,totalMin:0,cnt:0};
      m[e.driverName].total++;
      if(e.tripStatus==='delivered'){ m[e.driverName].delivered++; if(e.outTime&&e.inTime){m[e.driverName].totalMin+=(new Date(e.inTime)-new Date(e.outTime))/60000;m[e.driverName].cnt++;} }
    });
    return Object.values(m).map(d=>({...d,avg:d.cnt?Math.round(d.totalMin/d.cnt):0})).sort((a,b)=>b.delivered-a.delivered);
  },[entries]);

  const byBranch = useMemo(()=>BRANCHES.map(b=>({b,n:entries.filter(e=>e.branch===b).length,d:entries.filter(e=>e.branch===b&&e.tripStatus==='delivered').length})).filter(x=>x.n>0).sort((a,b)=>b.n-a.n),[entries]);

  const cardSty = {background:'var(--surface)',border:'1.5px solid var(--border)',borderRadius:'var(--radius-lg)',padding:'20px',boxShadow:'var(--shadow-sm)'};
  const sTitle = {fontWeight:700,fontSize:'15px',letterSpacing:'-.02em',marginBottom:'16px'};

  return (
    <div style={{display:'flex',flexDirection:'column',gap:'24px'}}>
      <div>
        <h2 style={{fontWeight:700,fontSize:'20px',letterSpacing:'-.03em'}}>Reports & Analytics</h2>
        <p style={{fontSize:'12.5px',color:'var(--muted)',marginTop:'2px'}}>Performance across companies, zones, drivers, branches · All time</p>
      </div>

      {/* Collection status overview */}
      <div style={cardSty}>
        <div style={sTitle}>Collection Status Overview</div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:'12px'}}>
          {collStatusStats.map(s=>{
            const pct = entries.length ? (s.count/entries.length)*100 : 0;
            return (
              <div key={s.key} style={{background:'var(--surface-2)',borderRadius:'var(--radius)',padding:'14px'}}>
                <CollStatusBadge status={s.key}/>
                <div style={{fontSize:'32px',fontWeight:700,letterSpacing:'-.04em',lineHeight:1,marginTop:'10px'}}>{s.count}</div>
                <div style={{height:'4px',background:'var(--border)',borderRadius:'99px',marginTop:'10px',overflow:'hidden'}}>
                  <div style={{height:'100%',background:'var(--amber-500)',borderRadius:'99px',width:`${pct}%`}}></div>
                </div>
                <div style={{fontSize:'11px',color:'var(--hint)',marginTop:'4px'}}>{Math.round(pct)}% of total</div>
              </div>
            );
          })}
        </div>
      </div>

      {/* Daily chart */}
      <div style={cardSty}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'16px'}}>
          <div style={{fontWeight:700,fontSize:'15px',letterSpacing:'-.02em'}}>Daily Trip Volume</div>
          <div style={{display:'flex',gap:'12px',fontSize:'11.5px',color:'var(--muted)'}}>
            <span style={{display:'flex',alignItems:'center',gap:'4px'}}><span style={{width:'10px',height:'10px',borderRadius:'2px',background:'#f59e0b',display:'inline-block'}}></span>Total</span>
            <span style={{display:'flex',alignItems:'center',gap:'4px'}}><span style={{width:'10px',height:'10px',borderRadius:'2px',background:'#22c55e',display:'inline-block'}}></span>Delivered</span>
            <span style={{display:'flex',alignItems:'center',gap:'4px'}}><span style={{width:'10px',height:'10px',borderRadius:'2px',background:'#fbbf24',opacity:.7,display:'inline-block'}}></span>Transit</span>
          </div>
        </div>
        {byDate.length===0 ? <EmptyState text="No data yet"/> : <BarChart data={byDate}/>}
      </div>

      {/* Company performance */}
      {byCompany.length>0 && (
        <div style={cardSty}>
          <div style={sTitle}>Key Company Performance</div>
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(280px,1fr))',gap:'16px'}}>
            {byCompany.map(kc=>{
              const p=cpal(kc.key);
              const pct=kc.total?(kc.delivered/kc.total)*100:0;
              return (
                <div key={kc.key} style={{border:`1.5px solid ${p.border}`,borderRadius:'var(--radius-lg)',overflow:'hidden'}}>
                  <div style={{height:'3px',background:p.dot}}></div>
                  <div style={{padding:'16px'}}>
                    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'12px'}}>
                      <span style={{display:'inline-flex',alignItems:'center',gap:'6px',padding:'4px 10px',borderRadius:'99px',background:p.bg,color:p.text,fontWeight:700,fontSize:'12px'}}>
                        <span style={{width:'6px',height:'6px',borderRadius:'50%',background:p.dot,flexShrink:0}}></span>
                        {kc.key}
                      </span>
                      <div style={{textAlign:'right'}}>
                        <div style={{fontWeight:700,fontSize:'22px',letterSpacing:'-.03em',lineHeight:1}}>{kc.total}</div>
                        <div style={{fontSize:'11px',color:'var(--muted)'}}>{kc.delivered} delivered</div>
                      </div>
                    </div>
                    <div style={{height:'5px',background:'var(--surface-2)',borderRadius:'99px',marginBottom:'12px',overflow:'hidden'}}>
                      <div style={{height:'100%',background:p.dot,borderRadius:'99px',width:`${pct}%`,transition:'width .5s'}}></div>
                    </div>
                    {/* Coll status breakdown */}
                    {kc.collStatus.length>0 && (
                      <div style={{marginBottom:'10px'}}>
                        <div style={{fontSize:'10px',fontWeight:700,color:'var(--hint)',letterSpacing:'.08em',marginBottom:'6px'}}>COLL. STATUS</div>
                        <div style={{display:'flex',flexWrap:'wrap',gap:'4px'}}>
                          {kc.collStatus.map(({s,n})=>(
                            <span key={s} style={{fontSize:'10.5px'}}>
                              <CollStatusBadge status={s} size="xs"/> ×{n}
                            </span>
                          ))}
                        </div>
                      </div>
                    )}
                    {/* Zone breakdown */}
                    {kc.zones.length>0 && (
                      <div style={{marginBottom:'10px'}}>
                        <div style={{fontSize:'10px',fontWeight:700,color:'var(--hint)',letterSpacing:'.08em',marginBottom:'6px'}}>ZONES</div>
                        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'4px'}}>
                          {kc.zones.map(({z,n})=>{
                            const zs=ZONE_STYLES[z];
                            return <div key={z} style={{display:'flex',justifyContent:'space-between',padding:'4px 8px',borderRadius:'var(--radius-sm)',background:zs?.bg,color:zs?.text,fontSize:'11.5px',fontWeight:600}}>
                              <span>{z}</span><span>{n}</span>
                            </div>;
                          })}
                        </div>
                      </div>
                    )}
                    {/* Sub breakdown */}
                    {kc.subs.length>0 && (
                      <div>
                        <div style={{fontSize:'10px',fontWeight:700,color:'var(--hint)',letterSpacing:'.08em',marginBottom:'6px'}}>SUB-COMPANIES</div>
                        {kc.subs.map(({s,n})=>(
                          <div key={s} style={{display:'flex',justifyContent:'space-between',fontSize:'12px',padding:'3px 0',borderBottom:'1px solid var(--border)'}}>
                            <span style={{color:'var(--muted)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',maxWidth:'75%'}}>{s}</span>
                            <span style={{fontWeight:700,flexShrink:0,marginLeft:'8px'}}>{n}</span>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* Driver + Branch */}
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'16px'}}>
        <div style={cardSty}>
          <div style={sTitle}>Driver Performance</div>
          {byDriver.length===0 ? <EmptyState text="No data yet"/> : (
            <div style={{display:'flex',flexDirection:'column',gap:'12px'}}>
              {byDriver.map((d,i)=>(
                <div key={d.name} style={{display:'flex',alignItems:'center',gap:'12px'}}>
                  <div style={{width:'32px',height:'32px',borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center',fontWeight:700,fontSize:'13px',flexShrink:0,background: i===0?'#fbbf24':i===1?'#d1d5db':i===2?'#fb923c':'var(--surface-2)',color: i===0?'var(--amber-900)':'var(--ink-2)'}}>
                    {i+1}
                  </div>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontWeight:600,fontSize:'13.5px',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{d.name}</div>
                    <div className="mono" style={{fontSize:'11px',color:'var(--hint)'}}>{d.mobile}</div>
                  </div>
                  <div style={{textAlign:'right',flexShrink:0}}>
                    <div className="mono" style={{fontSize:'13px',fontWeight:700}}>
                      <span style={{color:'var(--amber-700)'}}>{d.delivered}</span>
                      <span style={{color:'var(--hint)'}}> / {d.total}</span>
                    </div>
                    <div style={{fontSize:'11px',color:'var(--hint)'}}>avg {d.avg}m</div>
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>

        <div style={cardSty}>
          <div style={sTitle}>Branch Activity</div>
          {byBranch.length===0 ? <EmptyState text="No data yet"/> : (
            <div style={{display:'flex',flexDirection:'column',gap:'12px'}}>
              {byBranch.map(b=>{
                const pct=b.n?(b.d/b.n)*100:0;
                return (
                  <div key={b.b}>
                    <div style={{display:'flex',justifyContent:'space-between',fontSize:'13px',marginBottom:'5px'}}>
                      <span className="mono" style={{fontWeight:700,color:'var(--amber-800)'}}>{b.b}</span>
                      <span className="mono">
                        <span style={{color:'var(--amber-700)',fontWeight:700}}>{b.d}</span>
                        <span style={{color:'var(--hint)'}}> / {b.n}</span>
                      </span>
                    </div>
                    <div style={{height:'6px',background:'var(--surface-2)',borderRadius:'99px',overflow:'hidden'}}>
                      <div style={{height:'100%',background:'linear-gradient(90deg,#f59e0b,#d97706)',borderRadius:'99px',width:`${pct}%`,transition:'width .4s'}}></div>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      </div>

      {/* Zone summary */}
      <div style={cardSty}>
        <div style={sTitle}>Zone Summary</div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:'12px'}}>
          {ZONES.map(z=>{
            const te=entries.filter(e=>e.zone===z).length;
            const de=entries.filter(e=>e.zone===z&&e.tripStatus==='delivered').length;
            const pct=te?(de/te)*100:0;
            const zs=ZONE_STYLES[z];
            return (
              <div key={z} style={{background:zs?.bg,borderRadius:'var(--radius-lg)',padding:'16px',border:`1px solid ${zs?.text}30`}}>
                <ZonePill zone={z}/>
                <div style={{fontSize:'32px',fontWeight:700,letterSpacing:'-.04em',lineHeight:1,marginTop:'10px',color:'var(--ink)'}}>{te}</div>
                <div style={{fontSize:'11.5px',color:'var(--muted)',marginTop:'2px'}}>{de} delivered</div>
                {te>0 && <div style={{height:'4px',background:'rgba(0,0,0,.08)',borderRadius:'99px',marginTop:'10px',overflow:'hidden'}}>
                  <div style={{height:'100%',background:zs?.text,borderRadius:'99px',width:`${pct}%`,transition:'width .4s'}}></div>
                </div>}
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>

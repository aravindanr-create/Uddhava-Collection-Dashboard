const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVkc3FnaHhucnNkY2xmeGhncmF6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg0ODY3OTcsImV4cCI6MjA5NDA2Mjc5N30.Ezl5qfpzRxGRtNofz3aieTIPuNKKE-Kf5cxrHN4uHdU';

/* =========================================================================

const ZONES = ['Zone 1', 'Zone 2', 'Zone 3', 'Zone 4'];

const KEY_COMPANIES = {

const KEY_COMPANY_NAMES = Object.keys(KEY_COMPANIES);

const getSubCompanies = (keyCompany) =>

/* ✅ CHANGE 1: getZones now returns all ZONES for any free-typed subCompany string.
   Zones are no longer gated on the subCompany matching a predefined list. */
const getZones = (keyCompany, subCompany) =>
  keyCompany && KEY_COMPANIES[keyCompany] && subCompany
    ? ZONES
    : [];

const COMPANY_COLORS = {
  blue:    { bg:'bg-blue-100',    text:'text-blue-800',    border:'border-blue-300',    dot:'bg-blue-500'    },
  emerald: { bg:'bg-emerald-100', text:'text-emerald-800', border:'border-emerald-300', dot:'bg-emerald-500' },
  violet:  { bg:'bg-violet-100',  text:'text-violet-800',  border:'border-violet-300',  dot:'bg-violet-500'  },
  orange:  { bg:'bg-orange-100',  text:'text-orange-800',  border:'border-orange-300',  dot:'bg-orange-500'  },
  rose:    { bg:'bg-rose-100',    text:'text-rose-800',    border:'border-rose-300',    dot:'bg-rose-500'    },
  amber:   { bg:'bg-amber-100',   text:'text-amber-800',   border:'border-amber-300',   dot:'bg-amber-500'   },
};

const getCompanyColor = (keyCompany) =>
  COMPANY_COLORS[KEY_COMPANIES[keyCompany]?.color] || COMPANY_COLORS.amber;

const ZONE_STYLES = {
  'Zone 1': 'zone-badge-1',
  'Zone 2': 'zone-badge-2',
  'Zone 3': 'zone-badge-3',
  'Zone 4': 'zone-badge-4',
};

/* =========================================================================
   OTHER CONSTANTS
   ========================================================================= */
const BRANCHES  = ['TVK','RNT','HSR','MDU','SPR','CBM','DBR'];
const INCHARGES = ['Vinoth','Mani','Kumar','Ajith','Ramu','Ravi'];
const SHIFTS    = ['Day','Night'];

/* =========================================================================
   DATA LAYER
   ========================================================================= */
const LOCAL_KEY = 'uddhava_local_v4';
const DataContext = createContext(null);

function DataProvider({ children }) {
  const [entries,   setEntries]   = useState([]);
  const [connState, setConnState] = useState('connecting');
  const [connError, setConnError] = useState('');
  const [toast,     setToast]     = useState(null);
  const channelRef = useRef(null);

  const showToast = (msg, kind='ok') => {
    setToast({ msg, kind, id: Date.now() });
    setTimeout(() => setToast(null), 3500);
  };

  useEffect(() => {
    let cancelled = false;
    (async () => {
      try {
        const { data, error } = await sb.from('entries').select('*').order('created_at', { ascending: false });
        if (error) throw error;
        if (cancelled) return;
        setEntries((data || []).map(rowToEntry));
        setConnState('connected');
      } catch (e) {
        if (cancelled) return;
        setConnState('error');
        setConnError(e.message || 'Connection failed');
        try { const raw = localStorage.getItem(LOCAL_KEY); if (raw) setEntries(JSON.parse(raw)); } catch(_) {}
      }
    })();

    const ch = sb.channel('entries-rt')
      .on('postgres_changes', { event:'*', schema:'public', table:'entries' }, payload => {
        setEntries(prev => {
          let next = [...prev];
          if (payload.eventType === 'INSERT') {
            const r = rowToEntry(payload.new);
            if (!next.find(x => x.id === r.id)) next = [r, ...next];
          } else if (payload.eventType === 'UPDATE') {
            const r = rowToEntry(payload.new);
            const i = next.findIndex(x => x.id === r.id);
            if (i >= 0) next[i] = r; else next = [r, ...next];
          } else if (payload.eventType === 'DELETE') {
            next = next.filter(x => x.id !== payload.old.id);
          }
          try { localStorage.setItem(LOCAL_KEY, JSON.stringify(next)); } catch(_) {}
          return next;
        });
      })
      .subscribe();
    channelRef.current = ch;

    return () => {
      cancelled = true;
      if (channelRef.current) sb.removeChannel(channelRef.current);
    };
  }, []);

  const addEntry    = async (entry) => { const { error } = await sb.from('entries').insert(entryToRow(entry)); if (error) throw error; showToast('Entry saved ✓'); };
  const addEntries  = async (arr)   => { const { error } = await sb.from('entries').insert(arr.map(entryToRow)); if (error) throw error; showToast(`${arr.length} entries uploaded ✓`); };
  const updateEntry = async (id, patch) => { const { error } = await sb.from('entries').update(entryToRow(patch)).eq('id', id); if (error) throw error; showToast('Updated ✓'); };
  const deleteEntry = async (id) => { const { error } = await sb.from('entries').delete().eq('id', id); if (error) throw error; showToast('Deleted'); };

  return (
    <DataContext.Provider value={{ entries, connState, connError, addEntry, addEntries, updateEntry, deleteEntry, toast }}>
      {children}
    </DataContext.Provider>
  );
}
const useData = () => useContext(DataContext);

const entryToRow = (e) => ({
  id: e.id,
  date: e.date,
  type: e.type || 'collection',
  collection_name: e.collectionName || '',
  key_company:  e.keyCompany  || '',
  sub_company:  e.subCompany  || '',
  zone:         e.zone        || '',
  vehicle_no: e.vehicleNo || '',
  from_loc: e.fromLoc || '',
  to_loc: e.toLoc || '',
  branch: e.branch || '',
  shift: e.shift || '',
  incharge: e.incharge || '',
  driver_name: e.driverName || '',
  driver_mobile: e.driverMobile || '',
  out_time: e.outTime || null,
  in_time: e.inTime || null,
  status: e.status || 'transit',
  remarks: e.remarks || '',
  created_at: e.createdAt || new Date().toISOString(),
});
const rowToEntry = (r) => ({
  id: r.id,
  date: r.date,
  type: r.type,
  collectionName: r.collection_name || '',
  keyCompany:  r.key_company  || '',
  subCompany:  r.sub_company  || '',
  zone:        r.zone         || '',
  vehicleNo: r.vehicle_no,
  fromLoc: r.from_loc,
  toLoc: r.to_loc,
  branch: r.branch,
  shift: r.shift,
  incharge: r.incharge,
  driverName: r.driver_name,
  driverMobile: r.driver_mobile,
  outTime: r.out_time,
  inTime: r.in_time,
  status: r.status,
  remarks: r.remarks,
  createdAt: r.created_at,
});

/* =========================================================================
   HELPERS
   ========================================================================= */
const fmtTime = iso => iso ? new Date(iso).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:true}) : '—';
const fmtDate = iso => iso ? new Date(iso).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}) : '—';
const fmtDur  = (a,b) => { if (!a||!b) return '—'; const m=Math.round((new Date(b)-new Date(a))/60000); if(m<0) return '—'; return m<60?`${m}m`:`${Math.floor(m/60)}h ${String(m%60).padStart(2,'0')}m`; };
const toLocalInput = iso => { if (!iso) return ''; const d=new Date(iso),p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`; };
const todayStr = () => new Date().toISOString().slice(0,10);
const genId    = () => `E-${Date.now().toString(36).toUpperCase()}`;

/* =========================================================================
   COMPANY BADGE
   ========================================================================= */
function CompanyBadge({ keyCompany, subCompany, zone, size='sm' }) {
  if (!keyCompany) return null;
  const c = getCompanyColor(keyCompany);
  const zStyle = ZONE_STYLES[zone] || 'zone-badge-1';
  const textSz = size === 'xs' ? 'text-[10px]' : 'text-xs';
  return (
    <div className={`inline-flex items-center gap-1 flex-wrap ${textSz}`}>
      <span className={`inline-flex items-center gap-1 font-bold px-2 py-0.5 rounded-full ${c.bg} ${c.text}`}>
        <span className={`w-1.5 h-1.5 rounded-full shrink-0 ${c.dot}`}></span>
        {keyCompany}
      </span>
      {subCompany && <span className="text-slate-400">›</span>}
      {subCompany && <span className="font-semibold text-slate-600">{subCompany}</span>}
      {zone && <span className="text-slate-400">›</span>}
      {zone && <span className={`font-bold px-2 py-0.5 rounded-full ${zStyle}`}>{zone}</span>}
    </div>
  );
}

/* =========================================================================
   CASCADING COMPANY SELECTOR
   Sub-company is fully free-text; predefined names are suggestions only.
   ========================================================================= */
function CompanySelector({ keyCompany, subCompany, zone, onChange, errors = {} }) {
  const subOptions  = getSubCompanies(keyCompany);
  const zoneOptions = getZones(keyCompany, subCompany);

  const handleKeyChange = (val) => {
    onChange({ keyCompany: val, subCompany: '', zone: '' });
  };
  const handleSubChange = (val) => {
    onChange({ keyCompany, subCompany: val, zone: '' });
  };
  const handleZoneChange = (val) => {
    onChange({ keyCompany, subCompany, zone: val });
  };

  return (
    <div className="space-y-3">
      {/* Step 1: Key Company */}
      <div>
        <label className="block text-xs font-bold text-slate-700 mb-1.5">
          Key Company <span className="text-red-500">*</span>
          {errors.keyCompany && <span className="text-red-500 ml-2 font-normal">— {errors.keyCompany}</span>}
        </label>
        <div className="grid grid-cols-2 md:grid-cols-3 gap-2">
          {KEY_COMPANY_NAMES.map(name => {
            const c = getCompanyColor(name);
            const active = keyCompany === name;
            return (
              <button key={name} type="button" onClick={() => handleKeyChange(name)}
                className={`py-2.5 px-3 rounded-xl text-sm font-bold border-2 transition-all text-left flex items-center gap-2 ${
                  active
                    ? `${c.bg} ${c.text} ${c.border} shadow-sm`
                    : 'border-slate-200 hover:border-amber-300 hover:bg-amber-50 text-slate-600'
                }`}>
                <span className={`w-2 h-2 rounded-full shrink-0 ${active ? c.dot : 'bg-slate-300'}`}></span>
                {name}
              </button>
            );
          })}
        </div>
      </div>

      {/* Step 2: Sub Company — free-text with suggestions */}
      {keyCompany && (
        <div className="cascade-step fade-in">
          <label className="block text-xs font-bold text-slate-700 mb-1.5">
            Sub Company <span className="text-red-500">*</span>
            <span className="ml-1 font-normal text-slate-400">(type any name or pick a suggestion)</span>
            {errors.subCompany && <span className="text-red-500 ml-2 font-normal">— {errors.subCompany}</span>}
          </label>
          <div className="relative">
            <input
              list={`sub-list-${keyCompany}`}
              value={subCompany}
              onChange={e => handleSubChange(e.target.value)}
              placeholder={`Type any sub-company name…`}
              className="w-full px-3 py-2.5 border border-slate-300 rounded-lg text-sm focus:border-amber-400"
              autoComplete="off"
            />
            <datalist id={`sub-list-${keyCompany}`}>
              {subOptions.map(opt => <option key={opt} value={opt}/>)}
            </datalist>
          </div>
          {subOptions.length > 0 && (
            <div className="mt-1.5 flex flex-wrap gap-1">
              {subOptions.map(opt => (
                <button key={opt} type="button" onClick={() => handleSubChange(opt)}
                  className={`text-[11px] px-2 py-0.5 rounded-full border transition-all font-medium ${
                    subCompany === opt
                      ? 'bg-amber-400 border-amber-400 text-slate-900'
                      : 'border-slate-200 text-slate-500 hover:border-amber-300 hover:bg-amber-50'
                  }`}>
                  {opt}
                </button>
              ))}
            </div>
          )}
        </div>
      )}

      {/* Step 3: Zone */}
      {keyCompany && subCompany && (
        <div className="cascade-step fade-in">
          <label className="block text-xs font-bold text-slate-700 mb-1.5">
            Zone <span className="text-red-500">*</span>
            {errors.zone && <span className="text-red-500 ml-2 font-normal">— {errors.zone}</span>}
          </label>
          <div className="grid grid-cols-4 gap-2">
            {zoneOptions.map(z => {
              const zStyle = ZONE_STYLES[z] || '';
              const active = zone === z;
              return (
                <button key={z} type="button" onClick={() => handleZoneChange(z)}
                  className={`py-2.5 px-2 rounded-xl text-xs font-bold border-2 transition-all text-center ${
                    active
                      ? `${zStyle} border-current shadow-sm scale-105`
                      : 'border-slate-200 hover:border-amber-300 hover:bg-amber-50 text-slate-600'
                  }`}>
                  {z}
                </button>
              );
            })}
          </div>
        </div>
      )}

      {/* Live preview */}
      {keyCompany && subCompany && zone && (
        <div className="fade-in bg-slate-50 border border-slate-200 rounded-xl p-3 flex items-center gap-2">
          <span className="text-xs text-slate-500 font-semibold shrink-0">Selected:</span>
          <CompanyBadge keyCompany={keyCompany} subCompany={subCompany} zone={zone} />
        </div>
      )}
    </div>
  );
}

  return (

          <div className="flex items-center gap-3">
            <div className="w-10 h-10 bg-gradient-to-br from-amber-400 to-amber-600 rounded-xl flex items-center justify-center text-white shadow-md">
              <svg className="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M3 7h11v8H3zM14 10h4l3 3v2h-7zM5 17a2 2 0 11.001 4A2 2 0 015 17m12 0a2 2 0 11.001 4A2 2 0 0117 17"/></svg>
            </div>
            <div>
              <div className="font-extrabold text-lg leading-tight text-slate-900">Uddhava Logistics</div>
              <div className="font-mono text-[10px] text-slate-500 tracking-widest hide-mobile">Vehicle Allotment</div>
            </div>
          </div>
          <div className="flex items-center gap-3">
            <div className="hide-mobile text-right">
              <div className="text-xs text-slate-500">{now.toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long'})}</div>
              <div className="font-mono text-sm font-bold tabular-nums">{now.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}</div>
            </div>
            <div className={`flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11px] font-bold ${connMeta.cls}`}>
              <span className={`w-1.5 h-1.5 rounded-full ${connMeta.dot} ${connState==='connected'?'pulse-dot':''}`}></span>
              <span className="hide-mobile">{connMeta.label}</span>
            </div>
          </div>
        </div>
        <div className="px-2 md:px-6 flex gap-0 border-t border-amber-200">
          {tabs.map(t => (
            <button key={t.key} onClick={()=>setPage(t.key)}
              className={`px-3 md:px-5 py-2.5 text-sm font-bold border-b-2 transition-colors ${page===t.key?'border-blue-500 text-blue-700 bg-blue-50/50':'border-transparent text-slate-500 hover:text-slate-700'}`}>
              <span className="md:hidden mr-1">{t.icon}</span>{t.label}
            </button>
          ))}
        </div>
      </header>

      {page==='dashboard' && <Dashboard onNew={()=>setShowForm(true)} onEdit={setEditEntry} goEntries={()=>setPage('entries')}/>}
      {page==='entries'   && <EntriesPage onNew={()=>setShowForm(true)} onEdit={setEditEntry}/>}
      {page==='reports'   && <ReportsPage/>}

      <button onClick={()=>setShowForm(true)}
        className="md:hidden fixed bottom-6 right-6 w-14 h-14 bg-amber-500 hover:bg-amber-600 text-white rounded-full shadow-2xl shadow-amber-500/40 flex items-center justify-center z-20 active:scale-95 transition-transform">
        <svg className="w-7 h-7" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path d="M12 4v16m8-8H4"/></svg>
      </button>

      {(showForm || editEntry) && <EntryForm entry={editEntry} onClose={()=>{setShowForm(false);setEditEntry(null);}}/>}

      {toast && (
        <div className={`toast fixed bottom-6 left-1/2 -translate-x-1/2 z-50 px-5 py-3 rounded-2xl shadow-2xl font-semibold text-sm flex items-center gap-2 ${toast.kind==='bad'?'bg-red-600 text-white':'bg-slate-900 text-amber-300'}`}>
          {toast.kind==='bad'?'⚠':'✓'} {toast.msg}
        </div>
      )}
    </div>
  );
}

/* =========================================================================
   DASHBOARD
   ========================================================================= */
function Dashboard({ onNew, onEdit, goEntries }) {
  const { entries } = useData();
  const latestDate = useMemo(() => {
    const dates = [...new Set(entries.map(e=>e.date))].sort().reverse();
    return dates[0] || todayStr();
  }, [entries]);
  const day       = entries.filter(e=>e.date===latestDate);
  const transit   = day.filter(e=>e.status==='transit');
  const delivered = day.filter(e=>e.status==='delivered');
  const collections = day.filter(e=>e.type==='collection');
  const shiftStats  = SHIFTS.map(s=>({ shift:s, count:day.filter(e=>e.shift===s).length, done:day.filter(e=>e.shift===s&&e.status==='delivered').length }));
  const branchStats = BRANCHES.map(b=>({ branch:b, count:day.filter(e=>e.branch===b).length })).filter(x=>x.count>0);

  return (
    <div className="p-4 md:p-6 space-y-5 max-w-7xl mx-auto">
      {/* ── Hero ── */}
      <div className="rounded-2xl overflow-hidden shadow-lg" style={{background:"linear-gradient(135deg,#1e293b 0%,#0f172a 100%)"}}>
        <div className="relative p-6 md:p-7">
          <div className="absolute inset-0 opacity-5" style={{backgroundImage:"radial-gradient(circle,#fff 1px,transparent 1px)",backgroundSize:"22px 22px"}}></div>
          <div className="relative flex flex-wrap items-center justify-between gap-4 mb-6">
            <div>
              <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-amber-400/20 border border-amber-400/30 mb-3">
                <span className="w-1.5 h-1.5 bg-amber-400 rounded-full pulse-dot"></span>
                <span className="font-mono text-xs text-amber-300 tracking-widest font-bold">LIVE · OPERATIONS</span>
              </div>
              <h2 className="text-3xl md:text-4xl font-extrabold text-white tracking-tight">{fmtDate(latestDate)}</h2>
              <p className="text-slate-400 mt-1.5 text-sm">
                <span className="font-bold text-white">{day.length}</span> {day.length===1?'entry':'entries'} logged
                {transit.length>0 && <span className="ml-2 text-amber-300 font-semibold">· {transit.length} in transit</span>}
              </p>
            </div>
            <button onClick={onNew} className="hidden md:flex items-center gap-2 bg-amber-400 hover:bg-amber-300 text-slate-900 px-5 py-3 rounded-xl font-bold shadow-lg transition-all hover:scale-105 active:scale-100">
              <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="3" viewBox="0 0 24 24"><path d="M12 4v16m8-8H4"/></svg>
              New Entry
            </button>
          </div>
          <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
            <KPI label="Collections"  value={collections.length} sub="Inbound"     tone="blue"/>
            <KPI label="Total Today"  value={day.length}         sub="All entries" tone="purple"/>
            <KPI label="Delivered"    value={delivered.length}   sub="Completed"   tone="green" highlight/>
            <KPI label="In Transit"   value={transit.length}     sub="On route"    tone="amber" highlight/>
          </div>
        </div>
      </div>

      {/* In Transit */}
      <Section title="In Transit" subtitle={`${transit.length} vehicle${transit.length!==1?'s':''} currently out`}
        action={<button onClick={goEntries} className="text-sm text-amber-700 font-bold hover:underline">View all →</button>}>
        {transit.length===0
          ? <EmptyState text="All vehicles back. Nothing in transit."/>
          : <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">{transit.map(e=><TransitCard key={e.id} entry={e} onEdit={()=>onEdit(e)}/>)}</div>}
      </Section>

      <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
        <Section title="By Shift &amp; Branch" className="lg:col-span-1">
          <div className="space-y-3">
            {shiftStats.map(s=>{
              const pct = s.count?(s.done/s.count)*100:0;
              return (
                <div key={s.shift} className="section-card p-4">
                  <div className="flex justify-between items-baseline mb-2">
                    <div className="font-bold flex items-center gap-2"><span>{s.shift==='Day'?'☀️':'🌙'}</span>{s.shift} Shift</div>
                    <div className="font-mono text-sm"><span className="text-green-600 font-bold">{s.done}</span><span className="text-slate-400"> / {s.count}</span></div>
                  </div>
                  <div className="h-2 bg-amber-100 rounded-full overflow-hidden">
                    <div className="h-full bg-gradient-to-r from-amber-400 to-amber-600 rounded-full" style={{width:`${pct}%`}}></div>
                  </div>
                  <div className="text-xs text-slate-500 mt-1.5">{s.count?`${Math.round(pct)}% complete`:'No entries yet'}</div>
                </div>
              );
            })}
            {branchStats.length>0 && (
              <div className="section-card p-4 mt-3">
                <div className="font-bold mb-3 text-slate-900">By Branch</div>
                <div className="grid grid-cols-2 gap-2">
                  {branchStats.map(b=>(
                    <div key={b.branch} className="flex justify-between items-center bg-amber-50 px-3 py-2 rounded-lg">
                      <span className="font-mono font-bold text-amber-800">{b.branch}</span>
                      <span className="font-bold tabular-nums">{b.count}</span>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </div>
        </Section>

        <Section title="Recent Activity" className="lg:col-span-2">
          <div className="section-card divide-y divide-slate-50 overflow-hidden">
            {day.slice(0,8).map(e=><ActivityRow key={e.id} entry={e} onClick={()=>onEdit(e)}/>)}
            {day.length===0 && <EmptyState text="No entries logged yet today."/>}
          </div>
        </Section>
      </div>

      {/* ✅ CHANGE 3 & 4: Renamed to "Company wise Summary" + sorted by trip count descending */}
      <Section title="Company wise Summary" subtitle={`${fmtDate(latestDate)} · All companies`}>
        <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3">
          {[...KEY_COMPANY_NAMES]
            .sort((a,b) => day.filter(e=>e.keyCompany===b).length - day.filter(e=>e.keyCompany===a).length)
            .map(k => {
            const c = getCompanyColor(k);
            const total     = day.filter(e=>e.keyCompany===k).length;
            const deliveredK = day.filter(e=>e.keyCompany===k&&e.status==='delivered').length;
            const transitK   = day.filter(e=>e.keyCompany===k&&e.status==='transit').length;
            const pct       = total?(deliveredK/total)*100:0;
            const zones     = ZONES.map(z=>({ z, n:day.filter(e=>e.keyCompany===k&&e.zone===z).length })).filter(x=>x.n>0);
            return (
              <div key={k} className={`company-card border-2 ${c.border} overflow-hidden`}>
                <div className={`h-1.5 ${c.dot}`}></div>
                <div className="p-4">
                  <div className={`text-xs font-bold px-2.5 py-1 rounded-full inline-flex items-center gap-1.5 mb-3 ${c.bg} ${c.text}`}>
                    <span className={`w-1.5 h-1.5 rounded-full shrink-0 ${c.dot} ${total>0?'pulse-dot':''}`}></span>
                    {k}
                  </div>
                  <div className="font-extrabold text-3xl tabular-nums text-slate-900 leading-none">{total}</div>
                  <div className="text-xs text-slate-400 mt-0.5 font-medium">Total trips</div>
                  <div className="mt-3 flex justify-between text-xs">
                    <span className="text-green-600 font-bold">{deliveredK} done</span>
                    {transitK>0 && <span className="text-amber-600 font-semibold">{transitK} out</span>}
                  </div>
                  <div className="h-1.5 bg-slate-100 rounded-full mt-2 overflow-hidden">
                    <div className={`h-full rounded-full transition-all ${c.dot}`} style={{width:`${pct}%`}}></div>
                  </div>
                  {zones.length>0 && (
                    <div className="flex flex-wrap gap-1 mt-2.5">
                      {zones.map(({z,n})=>(
                        <span key={z} className={`text-[10px] font-bold px-1.5 py-0.5 rounded ${ZONE_STYLES[z]||''}`}>{z.replace('Zone ','Z')}{n>1?` ×${n}`:''}</span>
                      ))}
                    </div>
                  )}
                  {total===0 && <div className="text-[11px] text-slate-300 mt-2 font-medium">No trips today</div>}
                </div>
              </div>
            );
          })}
        </div>
      </Section>
    </div>
  );
}

const KPI = ({ label, value, sub, tone='amber', highlight }) => {
  const tones = {
    blue:   { bar:'bg-blue-400',   text:'text-blue-200',   bg:'bg-blue-500/10',   ring:'ring-blue-400/40',  val:'text-blue-100'   },
    purple: { bar:'bg-purple-400', text:'text-purple-200', bg:'bg-purple-500/10', ring:'ring-purple-400/40',val:'text-purple-100' },
    green:  { bar:'bg-emerald-400',text:'text-emerald-200',bg:'bg-emerald-500/10',ring:'ring-emerald-400/40',val:'text-emerald-100'},
    amber:  { bar:'bg-amber-400',  text:'text-amber-200',  bg:'bg-amber-500/10',  ring:'ring-amber-400/40', val:'text-amber-100'  },
  };
  const t = tones[tone];
  return (
    <div className={`relative rounded-2xl p-4 md:p-5 border border-white/10 bg-white/5 backdrop-blur-sm ${highlight?`ring-1 ${t.ring}`:''} overflow-hidden transition-all hover:bg-white/10`}>
      <div className={`absolute top-0 left-0 right-0 h-0.5 ${t.bar}`}></div>
      <div className="flex items-start justify-between mb-2">
        <div className={`font-mono text-[10px] tracking-widest font-bold ${t.text} opacity-80`}>{label.toUpperCase()}</div>
        <div className={`w-2 h-2 rounded-full ${t.bar} ${highlight?'pulse-dot':''}`}></div>
      </div>
      <div className={`font-extrabold text-4xl md:text-5xl leading-none tabular-nums tracking-tight ${highlight?t.val:'text-white'}`}>{value}</div>
      <div className={`text-xs mt-2 ${t.text} opacity-60`}>{sub}</div>
    </div>
  );
};

const Section = ({ title, subtitle, action, children, className='' }) => (
  <div className={className}>
    <div className="flex items-end justify-between mb-3">
      <div>
        <h3 className="text-lg font-extrabold text-slate-900">{title}</h3>
        {subtitle && <p className="text-sm text-slate-400">{subtitle}</p>}
      </div>
      {action}
    </div>
    {children}
  </div>
);

const EmptyState = ({ text }) => (
  <div className="bg-slate-50 border border-dashed border-slate-300 rounded-xl p-8 text-center text-slate-400">{text}</div>
);

function TransitCard({ entry, onEdit }) {
  const [, setTick] = useState(0);
  useEffect(()=>{ const i=setInterval(()=>setTick(t=>t+1),30000); return ()=>clearInterval(i); },[]);
  const elapsed = entry.outTime ? fmtDur(entry.outTime, new Date().toISOString()) : '—';
  return (
    <div onClick={onEdit} className="company-card p-4 cursor-pointer hover:border-amber-300">
      <div className="flex justify-between items-start mb-2">
        <div>
          <div className="flex items-center gap-2 flex-wrap">
            <span className="font-mono text-xs text-slate-500">{entry.id}</span>
            <span className="text-[10px] font-mono font-bold px-1.5 py-0.5 rounded bg-amber-100 text-amber-800">{entry.branch}</span>
          </div>
          <div className="font-extrabold text-slate-900 mt-1">{entry.vehicleNo}</div>
          {entry.keyCompany && (
            <div className="mt-1">
              <CompanyBadge keyCompany={entry.keyCompany} subCompany={entry.subCompany} zone={entry.zone} size="xs"/>
            </div>
          )}
        </div>
        <span className="inline-flex items-center gap-1.5 bg-amber-100 text-amber-800 px-2 py-1 rounded-full text-xs font-bold">
          <span className="w-1.5 h-1.5 bg-amber-500 rounded-full pulse-dot"></span>TRANSIT
        </span>
      </div>
      <div className="space-y-1 text-sm">
        <div className="flex items-center gap-2 text-slate-600"><span className="w-1.5 h-1.5 bg-green-500 rounded-full shrink-0"></span><span className="truncate">{entry.fromLoc}</span></div>
        <div className="flex items-center gap-2 text-slate-600"><span className="w-1.5 h-1.5 bg-red-500 rounded-full shrink-0"></span><span className="truncate">{entry.toLoc}</span></div>
      </div>
      <div className="border-t border-amber-100 mt-3 pt-3 grid grid-cols-3 gap-2 text-xs">
        <div><div className="font-mono text-slate-400">DRIVER</div><div className="font-bold text-slate-700 truncate">{entry.driverName}</div></div>
        <div><div className="font-mono text-slate-400">SHIFT</div><div className="font-bold text-slate-700">{entry.shift}</div></div>
        <div className="text-right"><div className="font-mono text-slate-400">OUT</div><div className="font-bold tabular-nums text-slate-700">{fmtTime(entry.outTime)}</div></div>
      </div>
      <div className="mt-2 pt-2 border-t border-amber-100 text-xs flex justify-between items-center">
        <span className="text-slate-500">Incharge: <span className="font-semibold text-slate-700">{entry.incharge}</span></span>
        <span className="font-mono font-extrabold text-amber-700">⏱ {elapsed}</span>
      </div>
    </div>
  );
}

function ActivityRow({ entry, onClick }) {
  return (
    <button onClick={onClick} className="w-full p-3.5 hover:bg-blue-50/40 text-left flex items-center gap-3 transition-colors">
      <div className={`w-10 h-10 rounded-lg flex items-center justify-center shrink-0 ${entry.status==='delivered'?'bg-green-100 text-green-700':'bg-amber-100 text-amber-700'}`}>
        {entry.status==='delivered'
          ? <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg>
          : <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M12 8v4l3 3"/><circle cx="12" cy="12" r="9"/></svg>}
      </div>
      <div className="flex-1 min-w-0">
        <div className="flex items-center gap-2 text-sm flex-wrap">
          <span className="font-extrabold">{entry.vehicleNo}</span>
          <span className="font-mono text-[10px] font-bold px-1.5 py-0.5 rounded bg-amber-100 text-amber-800">{entry.branch}</span>
          {entry.keyCompany && <CompanyBadge keyCompany={entry.keyCompany} subCompany="" zone="" size="xs"/>}
          <span className="text-slate-400">·</span>
          <span className="text-slate-600 truncate">{entry.fromLoc} → {entry.toLoc}</span>
        </div>
        <div className="text-xs text-slate-500 mt-0.5">{entry.shift} · {entry.driverName} · Incharge: {entry.incharge}</div>
      </div>
      <div className="text-right shrink-0 hide-mobile">
        <div className="font-mono text-sm tabular-nums text-slate-700">{fmtTime(entry.outTime)} → {fmtTime(entry.inTime)}</div>
        <div className="font-mono text-xs text-slate-500">{fmtDur(entry.outTime, entry.inTime)}</div>
      </div>
    </button>
  );
}

/* =========================================================================
   ENTRIES PAGE
   ========================================================================= */
function EntriesPage({ onNew, onEdit }) {
  const { entries } = useData();
  const [filter, setFilter] = useState({ date:'all', status:'all', shift:'all', branch:'all', keyCompany:'all', zone:'all', search:'' });
  const dates = useMemo(()=>[...new Set(entries.map(e=>e.date))].sort().reverse(),[entries]);

  const filtered = entries.filter(e => {
    if (filter.date       !== 'all' && e.date       !== filter.date)       return false;
    if (filter.status     !== 'all' && e.status     !== filter.status)     return false;
    if (filter.shift      !== 'all' && e.shift      !== filter.shift)      return false;
    if (filter.branch     !== 'all' && e.branch     !== filter.branch)     return false;
    if (filter.keyCompany !== 'all' && e.keyCompany !== filter.keyCompany) return false;
    if (filter.zone       !== 'all' && e.zone       !== filter.zone)       return false;
    if (filter.search) {
      const s = filter.search.toLowerCase();
      if (!`${e.id} ${e.vehicleNo} ${e.fromLoc} ${e.toLoc} ${e.driverName} ${e.driverMobile} ${e.incharge} ${e.branch} ${e.collectionName} ${e.keyCompany} ${e.subCompany} ${e.zone}`.toLowerCase().includes(s)) return false;
    }
    return true;
  });

  const exportCSV = () => {
    const h = ['ID','Date','Key Company','Sub Company','Zone','Vehicle','Branch','From','To','Shift','Incharge','Driver','Mobile','Out Time','In Time','Duration','Status','Remarks'];
    const rows = filtered.map(e=>[e.id,e.date,e.keyCompany||'',e.subCompany||'',e.zone||'',e.vehicleNo,e.branch,e.fromLoc,e.toLoc,e.shift,e.incharge,e.driverName,e.driverMobile,fmtTime(e.outTime),fmtTime(e.inTime),fmtDur(e.outTime,e.inTime),e.status,e.remarks||'']);
    const csv = [h,...rows].map(r=>r.map(c=>`"${String(c||'').replace(/"/g,'""')}"`).join(',')).join('\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
    a.download = `uddhava-${todayStr()}.csv`; a.click();
  };

  return (
    <div className="p-4 md:p-6 space-y-4 max-w-7xl mx-auto">
      <div className="flex flex-wrap items-end justify-between gap-3">
        <div>
          <h2 className="text-2xl font-extrabold">All Entries</h2>
          <p className="text-slate-500 text-sm">{filtered.length} of {entries.length} shown</p>
        </div>
        <div className="flex gap-2">
          <button onClick={exportCSV} className="px-3.5 py-2 border-2 border-amber-300 bg-white rounded-lg text-sm font-bold hover:border-amber-500 flex items-center gap-1.5">
            <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2M7 10l5 5 5-5M12 15V3"/></svg>
            CSV
          </button>
          <button onClick={onNew} className="btn-primary px-4 py-2 rounded-lg text-sm flex items-center gap-1.5">
            <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path d="M12 4v16m8-8H4"/></svg>
            New Entry
          </button>
        </div>
      </div>

      {/* Filters */}
      <div className="section-card p-3 flex flex-wrap gap-2">
        <input value={filter.search} onChange={e=>setFilter({...filter,search:e.target.value})}
          placeholder="🔍  Search vehicle, driver, company, zone..."
          className="flex-1 min-w-[200px] px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm"/>
        <select value={filter.date} onChange={e=>setFilter({...filter,date:e.target.value})} className="px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm">
          <option value="all">All Dates</option>
          {dates.map(d=><option key={d} value={d}>{fmtDate(d)}</option>)}
        </select>
        <select value={filter.keyCompany} onChange={e=>setFilter({...filter,keyCompany:e.target.value,zone:'all'})} className="px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm">
          <option value="all">All Companies</option>
          {KEY_COMPANY_NAMES.map(k=><option key={k} value={k}>{k}</option>)}
        </select>
        <select value={filter.zone} onChange={e=>setFilter({...filter,zone:e.target.value})} className="px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm">
          <option value="all">All Zones</option>
          {ZONES.map(z=><option key={z} value={z}>{z}</option>)}
        </select>
        <select value={filter.branch} onChange={e=>setFilter({...filter,branch:e.target.value})} className="px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm">
          <option value="all">All Branches</option>
          {BRANCHES.map(b=><option key={b} value={b}>{b}</option>)}
        </select>
        <select value={filter.status} onChange={e=>setFilter({...filter,status:e.target.value})} className="px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm">
          <option value="all">All Statuses</option>
          <option value="delivered">Delivered</option>
          <option value="transit">In Transit</option>
        </select>

/* =========================================================================
   SEARCHABLE DROPDOWN
   ========================================================================= */
function SearchableDropdown({ options, value, onChange, placeholder }) {
  const [open, setOpen] = useState(false);
  const [query, setQuery] = useState('');
  const ref = useRef(null);
  useEffect(() => {
    const h = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', h); return () => document.removeEventListener('mousedown', h);
  }, []);
  const filtered = options.filter(o=>o.toLowerCase().includes(query.toLowerCase()));
  return (
    <div ref={ref} className="relative">
      <button type="button" onClick={()=>{ setOpen(!open); setQuery(''); }}
        className="w-full px-3 py-2.5 border border-slate-300 rounded-lg flex items-center justify-between bg-white hover:border-amber-400 text-left">
        <span className={value?'text-slate-900 font-semibold':'text-slate-400'}>{value||placeholder}</span>
        <svg className={`w-4 h-4 text-slate-400 transition-transform ${open?'rotate-180':''}`} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M19 9l-7 7-7-7"/></svg>
      </button>
      {open && (
        <div className="absolute top-full left-0 right-0 mt-1 bg-white border-2 border-amber-300 rounded-lg shadow-xl z-20 fade-in overflow-hidden">
          <input autoFocus value={query} onChange={e=>setQuery(e.target.value)} placeholder="Type to search..." className="w-full px-3 py-2 border-b border-amber-200 text-sm"/>
          <div className="max-h-48 overflow-y-auto">
            {filtered.map(opt=>(
              <button key={opt} type="button" onClick={()=>{onChange(opt);setOpen(false);setQuery('');}}
                className={`w-full text-left px-3 py-2 text-sm hover:bg-amber-50 ${value===opt?'bg-amber-100 font-bold':''}`}>{opt}</button>
            ))}
            {filtered.length===0 && <div className="px-3 py-3 text-sm text-slate-400 text-center">No matches</div>}
          </div>
        </div>
      )}
    </div>
  );
}

/* ---- Single entry form ---- */
function SingleEntryForm({ entry, onClose, isEdit }) {
  const { addEntry, updateEntry, deleteEntry } = useData();
  const [form, setForm] = useState(entry
    ? { ...entry }
    : {
        type:'collection', date:todayStr(), collectionName:'',
        keyCompany:'', subCompany:'', zone:'',
        vehicleNo:'', fromLoc:'', toLoc:'', branch:'', shift:'Day',
        incharge:'', driverName:'', driverMobile:'',
        outTime:'', inTime:'', status:'transit', remarks:''
      }
  );
  const [errors, setErrors] = useState({});
  const [saving, setSaving] = useState(false);

  const setNow = (field) => {
    const d=new Date(), p=n=>String(n).padStart(2,'0');
    setForm({...form,[field]:`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`});
  };

  const handleCompanyChange = ({ keyCompany, subCompany, zone }) => {
    setForm(f => ({ ...f, keyCompany, subCompany, zone }));
  };

  const validate = () => {
    const e = {};
    if (!form.keyCompany)           e.keyCompany='Required';
    if (!form.subCompany)           e.subCompany='Required';
    if (!form.zone)                 e.zone='Required';
    if (!form.vehicleNo.trim())     e.vehicleNo='Required';
    if (!form.branch)               e.branch='Required';
    if (!form.fromLoc.trim())       e.fromLoc='Required';
    if (!form.toLoc.trim())         e.toLoc='Required';
    if (!form.incharge)             e.incharge='Required';
    if (!form.driverName.trim())    e.driverName='Required';
    if (!form.driverMobile.trim())  e.driverMobile='Required';
    if (!form.outTime)              e.outTime='Required';
    if (form.status==='delivered'&&!form.inTime) e.inTime='Required for delivered';
    if (form.inTime&&form.outTime&&new Date(form.inTime)<new Date(form.outTime)) e.inTime='Must be after out-time';
    setErrors(e); return Object.keys(e).length===0;
  };

  const save = async () => {
    if (!validate()) return;
    setSaving(true);
    try {
      if (isEdit) await updateEntry(entry.id, form);
      else        await addEntry({ ...form, id: genId(), createdAt: new Date().toISOString() });
      onClose();
    } catch(err) { alert('Save failed: '+err.message); setSaving(false); }
  };

  const markDelivered = () => setForm(f=>({...f,status:'delivered',inTime:f.inTime||toLocalInput(new Date().toISOString())}));

  const remove = async () => {
    if (!confirm('Delete this entry?')) return;
    try { await deleteEntry(entry.id); onClose(); }
    catch(err) { alert('Delete failed: '+err.message); }
  };

  return (
    <>
      <div className="flex-1 overflow-y-auto px-5 md:px-6 py-5 space-y-5">

        <div className="bg-slate-50 border-2 border-slate-200 rounded-xl p-4">
          <div className="font-mono text-[10px] tracking-widest text-slate-500 font-bold mb-3">COMPANY / ZONE ASSIGNMENT</div>
          <CompanySelector
            keyCompany={form.keyCompany}
            subCompany={form.subCompany}
            zone={form.zone}
            onChange={handleCompanyChange}
            errors={{ keyCompany: errors.keyCompany, subCompany: errors.subCompany, zone: errors.zone }}
          />
        </div>

        <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
          <Field label="Vehicle No." error={errors.vehicleNo} required>
            <input value={form.vehicleNo} onChange={e=>setForm({...form,vehicleNo:e.target.value.toUpperCase()})} placeholder="TN-09-AB-1234" className="w-full px-3 py-2.5 border border-slate-300 rounded-lg font-mono"/>
          </Field>
          <Field label="Date" required>
            <input type="date" value={form.date} onChange={e=>setForm({...form,date:e.target.value})} className="w-full px-3 py-2.5 border border-slate-300 rounded-lg"/>
          </Field>
        </div>

        <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
          <Field label="Branch" error={errors.branch} required>
            <SearchableDropdown options={BRANCHES} value={form.branch} onChange={v=>setForm({...form,branch:v})} placeholder="Select branch"/>
          </Field>
          <div></div>
        </div>

        <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
          <Field label="From Company" error={errors.fromLoc} required>
            <input value={form.fromLoc} onChange={e=>setForm({...form,fromLoc:e.target.value})} placeholder="Company / vendor name" className="w-full px-3 py-2.5 border border-slate-300 rounded-lg"/>
          </Field>
          <Field label="To Branch" error={errors.toLoc} required>
            <input value={form.toLoc} onChange={e=>setForm({...form,toLoc:e.target.value})} placeholder="Destination hub / branch" className="w-full px-3 py-2.5 border border-slate-300 rounded-lg"/>
          </Field>
        </div>

        <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
          <Field label="Shift" required>
            <div className="grid grid-cols-2 gap-1.5">
              {SHIFTS.map(s=>(
                <button key={s} type="button" onClick={()=>setForm({...form,shift:s})}
                  className={`py-2.5 px-2 rounded-lg text-sm font-bold border-2 flex items-center justify-center gap-1.5 ${form.shift===s?'bg-amber-500 border-amber-500 text-white':'border-slate-300 hover:border-amber-400 hover:bg-amber-50'}`}>
                  <span>{s==='Day'?'☀️':'🌙'}</span>{s}
                </button>
              ))}
            </div>
          </Field>
          <Field label="Shift Incharge" error={errors.incharge} required>
            <SearchableDropdown options={INCHARGES} value={form.incharge} onChange={v=>setForm({...form,incharge:v})} placeholder="Select incharge"/>
          </Field>
        </div>

        <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
          <Field label="Driver Name" error={errors.driverName} required>
            <input value={form.driverName} onChange={e=>setForm({...form,driverName:e.target.value})} placeholder="Full name" className="w-full px-3 py-2.5 border border-slate-300 rounded-lg"/>
          </Field>
          <Field label="Mobile Number" error={errors.driverMobile} required>
            <input type="tel" value={form.driverMobile} onChange={e=>setForm({...form,driverMobile:e.target.value})} placeholder="+91-XXXXX-XXXXX" className="w-full px-3 py-2.5 border border-slate-300 rounded-lg font-mono"/>
          </Field>
        </div>

        <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
          <Field label="Out Time" error={errors.outTime} required>
            <div className="flex gap-1.5">
              <input type="datetime-local" value={form.outTime} onChange={e=>setForm({...form,outTime:e.target.value})} className="flex-1 px-3 py-2.5 border border-slate-300 rounded-lg"/>
              <button type="button" onClick={()=>setNow('outTime')} className="px-3 bg-amber-100 hover:bg-amber-200 text-amber-800 rounded-lg text-xs font-bold">NOW</button>
            </div>
          </Field>
          <Field label="In Time" error={errors.inTime}>
            <div className="flex gap-1.5">
              <input type="datetime-local" value={form.inTime} onChange={e=>setForm({...form,inTime:e.target.value})} className="flex-1 px-3 py-2.5 border border-slate-300 rounded-lg"/>
              <button type="button" onClick={()=>setNow('inTime')} className="px-3 bg-amber-100 hover:bg-amber-200 text-amber-800 rounded-lg text-xs font-bold">NOW</button>
            </div>
          </Field>
        </div>

        {form.outTime && form.inTime && (
          <div className="bg-amber-100 border-2 border-amber-300 rounded-lg px-3 py-2 text-sm flex justify-between items-center">
            <span className="text-amber-700 font-semibold">⏱ Turnaround</span>
            <span className="font-mono font-extrabold text-amber-900">{fmtDur(form.outTime, form.inTime)}</span>
          </div>
        )}

        <Field label="Status" required>
          <div className="grid grid-cols-2 gap-2">
            <button type="button" onClick={()=>setForm({...form,status:'transit'})}
              className={`p-3 rounded-lg border-2 text-left ${form.status==='transit'?'bg-amber-50 border-amber-500':'border-slate-300 hover:border-amber-300'}`}>
              <div className="flex items-center gap-2 font-bold"><span className="w-2 h-2 bg-amber-500 rounded-full pulse-dot"></span>In Transit</div>
              <div className="text-xs text-slate-500 mt-0.5">Currently on route</div>
            </button>
            <button type="button" onClick={markDelivered}
              className={`p-3 rounded-lg border-2 text-left ${form.status==='delivered'?'bg-green-50 border-green-500':'border-slate-300 hover:border-green-300'}`}>
              <div className="flex items-center gap-2 font-bold">
                <svg className="w-4 h-4 text-green-600" fill="none" stroke="currentColor" strokeWidth="3" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg>Delivered
              </div>
              <div className="text-xs text-slate-500 mt-0.5">Trip completed</div>
            </button>
          </div>
        </Field>

        <Field label="Remarks (optional)">
          <textarea value={form.remarks} onChange={e=>setForm({...form,remarks:e.target.value})} rows={2} placeholder="Any notes..." className="w-full px-3 py-2.5 border border-slate-300 rounded-lg resize-none"/>
        </Field>
      </div>

      <div className="px-5 md:px-6 py-3.5 border-t-2 border-amber-200 bg-amber-50 md:rounded-b-2xl flex gap-2 sticky bottom-0">
        {isEdit && <button onClick={remove} className="px-3 py-2.5 text-red-600 hover:bg-red-50 rounded-lg text-sm font-bold">Delete</button>}
        <div className="flex-1"></div>
        <button onClick={onClose} className="px-4 py-2.5 border-2 border-slate-300 rounded-lg text-sm font-bold hover:bg-white">Cancel</button>

          {saving ? 'Saving...' : (isEdit ? 'Save Changes' : 'Log Entry')}
        </button>
      </div>
    </>
  );
